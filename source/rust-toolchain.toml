# A dated beta of 1.100, for cargo's new build-dir layout, stable's from 1.100 (2026-11-12): one
# directory for each unit, in place of one `deps/` directory that grows without end and that each
# `rustc` lists whole as its search path, so a build waits on its lock. The pin goes back to stable
# 1.100 when it is released (PLAN.md).
[toolchain]
channel = "beta-2026-10-15"
components = ["rustfmt", "clippy"]
