# A test mode that runs a rules package's script as its own, with no capability: a player and a
# rock that stands.
name = "test-ruled"
version = "0.1.0"
api = "1.0"
language = "en"
kind = "mode"
capabilities = []
tick_hz = { min = 30, max = 30, default = 30 }
teams = [{ name = "player", slots = 1 }, { name = "neutral", slots = 0 }]
backends = { collision = "circles", pathfinding = "grid", visibility = "grid_fog" }
max_move_speed = "1.0"
script_limits = { per_call = 1000, player = 1000, think = 1000, mode = 1000 }

[dependencies]
test-rules = { path = "../../rules" }
