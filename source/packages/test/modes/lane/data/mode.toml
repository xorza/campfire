script = "scripts/mode.rhai"

[combat]
damage_kinds = ["true"]
life = "health"

# Every stat its units carry: those the engine reads, and its pools' maxima.
[stats]
health = {}
mana = {}
attack_damage = {}
attack_speed = { max = "2.5" }
move_speed = {}

[pools.health]
max = "health"
[pools.mana]
max = "mana"

[params]
wave_ms = 30000
# A hero comes back at its spawn this long after it dies.
respawn_ms = 5000
wave = ["creep", "creep"]

# The kinds of slot actions sit in: a hero's three basic abilities and its ultimate.
[[slots]]
name = "basic"
ranks = 5

[[slots]]
name = "ultimate"
ranks = 3

# Each player plays a hero no other player has.
[choices.hero]
offers = "avatars"
unique = true

[[slots]]
name = "weapon"

# Each unit type's weapon: its attack, at the rate and for the damage of its stats.
[actions.creep_attack]
kind = "attack"
targeting = "enemies"
range = "1.0"
windup_ms = 300
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "true"

[actions.tower_attack]
kind = "attack"
targeting = "enemies"
range = "6.25"
windup_ms = 150
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "true"
delivery = { projectile = "tower_bolt" }

# Modifiers no script gives, for the tests to give a hero: a slow that halves its move speed for a
# second, and a stun that stops it for half a second.
[modifiers.slow]
duration_ms = 1000
stats = { move_speed = { cut = "0.5" } }

[modifiers.stun]
duration_ms = 500
tags = ["stunned"]

[tags.stunned]
blocks = ["move"]
