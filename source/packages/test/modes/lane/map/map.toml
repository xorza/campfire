# The map runs from x = −20 to 20 and z = −8 to 8, and sight reveals 1 m cells over it.
[bounds]
min = [-20, -8]
max = [20, 8]

[grid]
cell = "1.0"

# The lane runs along x through the origin; each side's tower stands 8 m down it from the middle,
# where the heroes spawn.
[[paths]]
name = "lane"
points = [[-16, 0], [0, 0], [16, 0]]

[spawns]
west = [0, 0]
east = [0, 0]

[[structures]]
unit_type = "tower"
team = "west"
path = "lane"
pos = [-8, 0]

[[structures]]
unit_type = "tower"
team = "east"
path = "lane"
pos = [8, 0]
