# The name players see.
name = "mode-name"

scripts = [{ package = "zero-hour", path = "scripts/mode.rhai" }]

# The name players see of each team.
[teams.player_1]
name = "team-player-1"

[teams.player_2]
name = "team-player-2"

[teams.player_3]
name = "team-player-3"

[teams.neutral]
name = "team-neutral"

# What each player starts with, by its faction, as Zero Hour's skirmish gives it: a base its
# center and dozer, an outpost its center alone.
[params]
start_building_base = "center"
start_units_base = ["dozer"]
start_offset_base = "2"
start_building_outpost = "center"
start_units_outpost = []
start_offset_outpost = "2"
# What a seat that starts with a base gets besides, by its faction: a second center and two
# dozers, or nothing.
base_buildings_base = ["center"]
base_units_base = ["dozer"]
base_buildings_outpost = []
base_units_outpost = []
base_count = 2

# The faction each player plays, which the session's host picks for a seat, and a seat with no
# pick draws.
[choices.faction]
name = "choice-faction"
offers = "values"
values = ["base", "outpost"]

# Whether each seat starts with a base too, which the session's host picks for a seat; a seat
# with no pick starts with none.
[choices.start]
name = "choice-start"
offers = "values"
values = ["standard", "base"]

# The money each player starts with, which the session's host picks.
[options.start_money]
values = [100, 5000]
default = 100
