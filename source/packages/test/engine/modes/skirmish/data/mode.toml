# The name players see.
name = "mode-name"

scripts = [{ package = "zero-hour", path = "scripts/mode.rhai" }]

# The name players see of each team.
[teams.player_1]
name = "team-player-1"

[teams.player_2]
name = "team-player-2"

[teams.player_3]
name = "team-player-3"

[teams.neutral]
name = "team-neutral"

# What each player starts with, by its faction, as Zero Hour's skirmish gives it: a base its
# center and dozer, an outpost its center alone.
[params]
start_building_base = "center"
start_units_base = ["dozer"]
start_offset_base = "2"
start_building_outpost = "center"
start_units_outpost = []
start_offset_outpost = "2"
# What a player slot that starts with a base gets besides, by its faction: a second center and two
# dozers, or nothing.
base_buildings_base = ["center"]
base_units_base = ["dozer"]
base_buildings_outpost = []
base_units_outpost = []
# What each faction's attacker trains and sends: none of the base's dozers.
army_units_base = []
army_units_outpost = []
# What gathers for each faction, and the buildings it delivers to.
gatherers_base = []
gatherers_outpost = []
drop_offs_base = []
drop_offs_outpost = []
base_count = 2

# The faction each player plays, which the session's host picks for a player slot, and a player slot with no
# pick draws.
[choices.faction]
name = "choice-faction"
offers = "values"
values = ["base", "outpost"]

# Whether each player slot starts with a base too, which the session's host picks for a player slot; a player_slot
# with no pick starts with none.
[choices.start]
name = "choice-start"
offers = "values"
values = ["standard", "base"]

# The money each player starts with, which the session's host picks.
[options.start_money]
values = [100, 5000]
default = 100

# Zero Hour's bots, as the import names them.
[bots.builder]
script = { package = "zero-hour", path = "scripts/bot.rhai" }
think_ms = 10000
params = { army = 0, gatherers = 3, place_gap = 10, place_steps = 64 }

[bots.attacker]
script = { package = "zero-hour", path = "scripts/bot.rhai" }
think_ms = 10000
params = { army = 30, gatherers = 3, guard = 400, sight = 5000, reach = 300, place_gap = 10, place_steps = 64 }
