# A test mode: one lane, a tower a side and waves of two creeps, with a hero for each side.
name = "test-lane"
version = "0.1.0"
api = "1.0"
language = "en"
kind = "mode"
capabilities = ["combat", "stats", "abilities", "projectiles", "orders", "navigation", "vision", "progression"]
tick_hz = { min = 30, max = 30, default = 30 }
teams = [{ name = "west", player_slots = 1 }, { name = "east", player_slots = 1 }]
max_move_speed = "7.5"
script_limits = { per_call = 20000, player = 20000, think = 200000, mode = 20000 }

[dependencies]
hero-runner = { path = "../../heroes/runner" }
hero-walker = { path = "../../heroes/walker" }
test-ai = { path = "../../ai" }
