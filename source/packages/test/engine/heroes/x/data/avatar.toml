# Hero X, on both tracks, with one ability, `strike`, a cast of no target, cost, time or script,
# of the 2 ranks of its slot kind.
name = "hero-x"
pools = ["health"]
stats = { health = { base = 10 }, move_speed = { base = 10 } }
combat = { on_death = "stay" }
tracks = ["level", "valor"]
slots = { basic = ["strike"] }

[actions.strike]
name = "action-strike"
targeting = "none"
