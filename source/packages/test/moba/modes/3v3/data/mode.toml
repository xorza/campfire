script = "scripts/mode.rhai"
# What its players earn and spend.
resources = ["gold"]

# Its damage kinds, its life pool, and the stats its damage and heals read: a ratio is a
# fraction, 0.1 a tenth.
[combat]
damage_kinds = ["physical", "magic", "true"]
assist_window_ms = 10000
life = "health"
leech = { attack = "life_steal", other = "spell_vamp" }
heal_scale = "healing_received_pct"

# Every stat its units carry, those the engine reads among them, and its limits. A rate is a
# fraction: 0.1 adds a tenth.
[stats]
health = {}
health_regen = {}
mana = {}
mana_regen = {}
energy = {}
energy_regen = {}
attack_damage = {}
ability_power = {}
armor = {}
magic_resist = {}
armor_pen = {}
magic_pen = {}
move_speed = {}
physical_block = {}
healing_received_pct = { min = -1 }
damage_dealt_pct = { min = -1 }
attack_speed = { max = "2.5" }
crit_chance = { min = 0, max = 1 }
armor_pen_pct = { min = 0, max = 1 }
magic_pen_pct = { min = 0, max = 1 }
life_steal = { min = 0, max = 1 }
spell_vamp = { min = 0, max = 1 }
cooldown_reduction = { min = 0, max = "0.4" }

# The amounts its units spend and lose: life, and what heroes spend on abilities.
[pools.health]
max = "health"
regen = "health_regen"
[pools.mana]
max = "mana"
regen = "mana_regen"
[pools.energy]
max = "energy"
regen = "energy_regen"

# A hero's levels, 1 to 18: the experience that reaches each from 2, League of Legends' table.
[tracks.level]
level = true
levels = [280, 660, 1140, 1720, 2400, 3180, 4060, 5040, 6120, 7300, 8580, 9960, 11440, 13020, 14700, 16480, 18360]

# What its tags do: crowd control, stealth and true sight. A slow, a cut of `move_speed`, grants
# `slowed`, which `slow_immune` holds without effect.
[tags.stunned]
blocks = ["move", "attack", "cast", "use"]
[tags.airborne]
blocks = ["move", "attack", "cast", "use"]
[tags.rooted]
blocks = ["move"]
[tags.silenced]
blocks = ["cast"]
[tags.disarmed]
blocks = ["attack"]
[tags.untargetable]
blocks = ["target"]
[tags.invulnerable]
blocks = ["target", "damage"]
[tags.stealthed]
hidden = true
[tags.true_sight]
detects = true
[tags.slow_immune]
immune = ["slowed"]

[inputs]
hero = "string"
spells = "string_list"

[state]
phase = { type = "string", default = "pick", sync = "all" }
first_blood = { type = "bool", default = false, sync = "all" }

[params]
pick_ms = 60000
first_wave_ms = 60000
wave_ms = 30000
wave = ["melee_creep", "melee_creep", "melee_creep", "caster_creep", "caster_creep", "caster_creep"]
income_ms = 5000
income_gold = 8
respawn_base_ms = 5000
respawn_per_level_ms = 2500
kill_gold = 300
first_blood_gold = 100
assist_gold = 150
hero_xp_base = 150
hero_xp_per_level = 25
xp_radius = "16.0"
inhibitor_respawn_ms = 240000
camp_respawn_ms = 60000
warden_respawn_ms = 360000

[modifiers.warden_blessing]
duration_ms = 180000
stats = { attack_damage = { pct = "0.1" }, ability_power = { pct = "0.1" } }

# The kinds of slot actions sit in, in the order a hero's keys bind them: three basic abilities
# and the ultimate, which heroes learn rank by rank at the levels League of Legends allows, then
# the spells players choose.
[[slots]]
name = "basic"
ranks = 5
levels = [1, 3, 5, 7, 9]

[[slots]]
name = "ultimate"
ranks = 3
levels = [6, 11, 16]

[[slots]]
name = "spell"

# A player may join after the start, in an open slot or in place of a bot; a player who leaves
# leaves their hero to a bot until they come back.
[players]
late_join = true
bot_takeover = true
leaver = "bot"

# Each player chooses a hero no other player has, and two spells.
[choices.hero]
offers = "avatars"
unique = true

[choices.spells]
offers = "loadout"
count = 2
slot = "spell"

[[slots]]
name = "weapon"

# The six slots of a hero's inventory, after its weapon: each item's active, if it has one.
[[slots]]
name = "item"

# Each team's base sells items, and buys them back at 70% of their cost, as League of Legends'
# shop does; a dead hero shops from anywhere.
[shop]
items = [
    "health_potion",
    "mana_potion",
    "sight_ward",
    "vision_ward",
    "elixir_of_sight",
    "long_sword",
    "ruby_crystal",
    "cloth_armor",
    "warblade",
    "stoneplate",
    "quicksilver",
]
resource = "gold"
at = "shop"
sell_share = "0.7"

# Consumables: potions that restore 120 health or 75 mana over 15 s, five to a slot; a sight
# ward, hidden, that watches for 90 s, and a vision ward, seen, with true sight and no end, two
# to a slot; and an elixir of true sight until death.
[items.health_potion]
cost = { gold = 50 }
stack = 5
uses = 1
action = "drink_health_potion"

[items.mana_potion]
cost = { gold = 50 }
stack = 5
uses = 1
action = "drink_mana_potion"

[items.sight_ward]
cost = { gold = 75 }
stack = 2
uses = 1
action = "place_sight_ward"

[items.vision_ward]
cost = { gold = 75 }
stack = 2
uses = 1
action = "place_vision_ward"

[items.elixir_of_sight]
cost = { gold = 250 }
uses = 1
action = "drink_elixir_of_sight"

# Components, each a stat its carrier holds.
[items.long_sword]
cost = { gold = 350 }
modifiers = ["long_sword"]

[items.ruby_crystal]
cost = { gold = 400 }
modifiers = ["ruby_crystal"]

[items.cloth_armor]
cost = { gold = 300 }
modifiers = ["cloth_armor"]

# Items built from components: a warblade of attack damage and health; a stoneplate of armor and
# health whose active hardens its carrier; and a quicksilver of armor whose active cleanses
# slows and roots.
[items.warblade]
cost = { gold = 1100 }
components = ["long_sword", "ruby_crystal"]
modifiers = ["warblade"]

[items.stoneplate]
cost = { gold = 1000 }
components = ["cloth_armor", "ruby_crystal"]
modifiers = ["stoneplate"]
action = "harden"

[items.quicksilver]
cost = { gold = 900 }
components = ["cloth_armor"]
modifiers = ["quicksilver"]
action = "cleanse"

[modifiers.health_potion]
stats = { health_regen = 8 }

[modifiers.mana_potion]
stats = { mana_regen = 5 }

[modifiers.elixir_of_sight]
tags = ["true_sight"]

[modifiers.long_sword]
stats = { attack_damage = 10 }

[modifiers.ruby_crystal]
stats = { health = 150 }

[modifiers.cloth_armor]
stats = { armor = 15 }

[modifiers.warblade]
stats = { attack_damage = 25, health = 300 }

[modifiers.stoneplate]
stats = { armor = 40, health = 250 }

[modifiers.hardened]
stats = { armor = 60 }

[modifiers.quicksilver]
stats = { armor = 20 }

[actions.drink_health_potion]
targeting = "none"
on_resolve = [{ modifier = { id = "health_potion", duration_ms = 15000 }, to = "source" }]

[actions.drink_mana_potion]
targeting = "none"
on_resolve = [{ modifier = { id = "mana_potion", duration_ms = 15000 }, to = "source" }]

[actions.place_sight_ward]
targeting = "point"
range = "6.0"
on_resolve = [{ spawn = { unit_type = "sight_ward", duration_ms = 90000 } }]

[actions.place_vision_ward]
targeting = "point"
range = "6.0"
on_resolve = [{ spawn = { unit_type = "vision_ward" } }]

[actions.drink_elixir_of_sight]
targeting = "none"
on_resolve = [{ modifier = { id = "elixir_of_sight" }, to = "source" }]

[actions.harden]
targeting = "none"
cooldown_ms = 60000
on_resolve = [{ modifier = { id = "hardened", duration_ms = 2500 }, to = "source" }]

[actions.cleanse]
targeting = "none"
cooldown_ms = 90000
on_resolve = [{ purge = { tag = "slowed" }, to = "source" }, { purge = { tag = "rooted" }, to = "source" }]

# Each unit type's weapon: its attack, at the rate and for the damage of its stats.
[actions.melee_creep_attack]
kind = "attack"
targeting = "enemies"
range = "1.1"
windup_ms = 300
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"

[actions.caster_creep_attack]
kind = "attack"
targeting = "enemies"
range = "6.0"
windup_ms = 300
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"
delivery = { projectile = "caster_creep_bolt" }

[actions.super_creep_attack]
kind = "attack"
targeting = "enemies"
range = "1.7"
windup_ms = 300
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"

[actions.tower_attack]
kind = "attack"
targeting = "enemies"
range = "7.75"
windup_ms = 150
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"
delivery = { projectile = "tower_bolt" }

[actions.wolf_attack]
kind = "attack"
targeting = "enemies"
range = "1.25"
windup_ms = 300
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"

[actions.warden_attack]
kind = "attack"
targeting = "enemies"
range = "5.0"
windup_ms = 400
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"
delivery = { projectile = "warden_bolt" }
