name = "hero-name"
tags = ["tank"]
pools = ["health", "mana"]
tracks = ["level"]
passive = "withering_touch"
slots = { basic = ["grasping_wraps", "dread", "lash_out"], ultimate = ["tomb_bind"], weapon = ["attack"] }
inventory = { slots = 6, kind = "item" }

[combat]

[collision]
radius = "0.5"

[vision]
sight_range = "12.0"

[stats]
health = { base = 472, per_level = 84 }
health_regen = { base = "1.5", per_level = "0.17" }
mana = { base = 220, per_level = 40 }
mana_regen = { base = "1.3", per_level = "0.1" }
attack_damage = { base = 47, per_level = "3.8" }
attack_speed = { base = "0.638", per_level = "0.0218" }
armor = { base = 18, per_level = "3.3" }
magic_resist = { base = 30 }
move_speed = { base = "3.35" }

[modifiers.withering_touch]
script = "scripts/withering_touch.rhai"

[modifiers.withered]
duration_ms = 3000
stats = { magic_resist = -15 }

[actions.grasping_wraps]
script = "scripts/grasping_wraps.rhai"
targeting = "direction"
range = "11.0"
cooldown_ms = [16000, 14000, 12000, 10000, 8000]
cost = { mana = [80, 90, 100, 110, 120] }
windup_ms = 250
delivery = { projectile = "grasping_wraps" }

[actions.grasping_wraps.params]
pull_speed = "18"
damage = { base = [80, 140, 200, 260, 320], ability_power = "0.7" }
stun_ms = 1000

[actions.dread]
targeting = "none"
toggle = { cost_per_second = { mana = 8 } }
hold = "dread"

[actions.dread.params]
radius = "3.0"
share = ["0.015", "0.02", "0.025", "0.03", "0.035"]

[modifiers.dread]
script = "scripts/dread.rhai"
interval_ms = 1000

[actions.lash_out]
script = "scripts/lash_out.rhai"
targeting = "none"
cooldown_ms = [10000, 9000, 8000, 7000, 6000]
cost = { mana = 35 }
passive_modifier = "lash_out_guard"

[actions.lash_out.params]
radius = "3.5"
block = [2, 4, 6, 8, 10]
damage = { base = [75, 100, 125, 150, 175], ability_power = "0.5" }
cooldown_cut_ms = 500

[modifiers.lash_out_guard]
script = "scripts/lash_out.rhai"
stats = { physical_block = { param = "block" } }

[actions.tomb_bind]
script = "scripts/tomb_bind.rhai"
targeting = "none"
cooldown_ms = [150000, 130000, 110000]
cost = { mana = [100, 150, 200] }

[actions.tomb_bind.params]
radius = "5.5"
damage = { base = [150, 250, 350], ability_power = "0.8" }
bind_ms = 2000

[modifiers.entombed]
duration_ms = { param = "bind_ms" }
tags = ["rooted", "disarmed"]

# A stun: its time comes from the call that applies it.
[modifiers.stun]
tags = ["stunned"]

[actions.attack]
kind = "attack"
targeting = "enemies"
range = "1.25"
windup_ms = 300
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"

[units.grasping_wraps]
projectile = { speed = "20", width = "1.6", stop_on_hit = true }
