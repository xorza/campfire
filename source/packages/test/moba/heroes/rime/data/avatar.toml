name = "hero-name"
tags = ["marksman"]
pools = ["health", "mana"]
tracks = ["level"]
passive = "stillness"
slots = { basic = ["chill_arrows", "fan_of_frost", "snow_owl"], ultimate = ["glacier_arrow"], weapon = ["attack"] }
inventory = { slots = 6, kind = "item" }

[combat]

[collision]
radius = "0.5"

[vision]
sight_range = "12.0"

[stats]
health = { base = 395, per_level = 79 }
health_regen = { base = "0.9", per_level = "0.11" }
mana = { base = 173, per_level = 53 }
mana_regen = { base = "1.3", per_level = "0.08" }
attack_damage = { base = 46, per_level = "2.85" }
attack_speed = { base = "0.658", per_level = "0.021" }
armor = { base = "11.5", per_level = "3.4" }
magic_resist = { base = 30 }
move_speed = { base = "3.25" }

[modifiers.stillness]
script = "scripts/stillness.rhai"
interval_ms = 3000
stats = { crit_chance = "0.03" }

[actions.chill_arrows]
targeting = "none"
toggle = { cost_per_attack = { mana = 8 } }
hold = "chill_arrows"

[actions.chill_arrows.params]
slow = ["0.15", "0.20", "0.25", "0.30", "0.35"]
slow_ms = 2000

[modifiers.chill_arrows]
script = "scripts/chill_arrows.rhai"

[actions.fan_of_frost]
targeting = "direction"
range = "12.0"
cooldown_ms = [16000, 13000, 10000, 7000, 4000]
cost = { mana = 60 }
windup_ms = 250
delivery = { projectile = "frost_arrow", count = 7, spread_deg = "57.5" }
on_hit = [
    { damage = { amount = { param = "damage" }, kind = "physical" } },
    { modifier = { id = "slow", duration_ms = { param = "slow_ms" } } },
]

[actions.fan_of_frost.params]
damage = { base = [40, 50, 60, 70, 80], attack_damage = "1.0" }
slow = ["0.15", "0.20", "0.25", "0.30", "0.35"]
slow_ms = 2000

[actions.snow_owl]
script = "scripts/snow_owl.rhai"
targeting = "point"
range = ["25", "32.5", "40", "47.5", "55"]
cooldown_ms = 60000
passive_modifier = "snow_owl_bounty"
delivery = { projectile = "snow_owl" }

[actions.snow_owl.params]
bonus_gold = [1, 2, 3, 4, 5]
sight_radius = "4.0"
linger_ms = 5000

[modifiers.snow_owl_bounty]
script = "scripts/snow_owl.rhai"

[actions.glacier_arrow]
script = "scripts/glacier_arrow.rhai"
targeting = "direction"
range = "global"
cooldown_ms = [100000, 90000, 80000]
cost = { mana = 150 }
windup_ms = 250
delivery = { projectile = "glacier_arrow" }

[actions.glacier_arrow.params]
damage = { base = [250, 425, 600], ability_power = "1.0" }
splash_radius = "2.5"
splash_share = "0.5"
min_stun_ms = 1000
max_stun_ms = 3500
full_stun_distance = "15"
slow = "0.5"
slow_ms = 3000

# A slow by the `slow` param of the ability that applies it; its time comes from the call.
[modifiers.slow]
stats = { move_speed = { cut = { param = "slow" } } }
tags = ["slowed"]

# A stun: its time comes from the call that applies it.
[modifiers.stun]
tags = ["stunned"]

[actions.attack]
kind = "attack"
targeting = "enemies"
range = "6.0"
windup_ms = 230
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"
delivery = { projectile = "arrow" }

[units.frost_arrow]
projectile = { speed = "15", width = "0.4", stop_on_hit = true, once_per_cast = true }

[units.snow_owl]
projectile = { speed = "14", hits = "none" }
vision = { sight_range = "4.0" }

[units.glacier_arrow]
projectile = { speed = "16", width = "1.3", stop_on_hit = true, hits = "enemies:avatar" }

[units.arrow]
projectile = { speed = "20", homing = true }
