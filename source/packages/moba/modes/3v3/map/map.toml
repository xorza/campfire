# Two lanes, west and east, from the north base at z = -60 to the south base at z = 60, and the
# jungle between them, walled off from each lane's corners. Points are [x, z] in meters on the
# ground plane.

# The map runs from x = −48 to 48 and z = −68 to 68, and sight reveals 1 m cells over it.
[bounds]
min = [-48, -68]
max = [48, 68]

[grid]
cell = "1.0"

# Brush on the outer side of each lane's middle: only a unit in it sees who stands there.
[[grid.brush]]
points = [[-47, -6], [-43, -6], [-43, 6], [-47, 6]]

[[grid.brush]]
points = [[43, -6], [47, -6], [47, 6], [43, 6]]

# Units plan their routes over half-meter cells.
[navigation]
cell = "0.5"

# Walls between each lane's corner and the jungle, the same on every side.
[[navigation.walls]]
points = [[-34, -32], [-31, -32], [-31, -23], [-34, -23]]

[[navigation.walls]]
points = [[31, -32], [34, -32], [34, -23], [31, -23]]

[[navigation.walls]]
points = [[-34, 23], [-31, 23], [-31, 32], [-34, 32]]

[[navigation.walls]]
points = [[31, 23], [34, 23], [34, 32], [31, 32]]

[[paths]]
name = "west"
points = [[-6, -50], [-36, -36], [-40, 0], [-36, 36], [-6, 50]]

[[paths]]
name = "east"
points = [[6, -50], [36, -36], [40, 0], [36, 36], [6, 50]]

# Where each team's heroes spawn, and the end of the lanes its creeps walk from.
[[markers]]
name = "north_spawn"
tags = ["spawn"]
team = "north"
pos = [0, -60]
params = { from = "start" }

[[markers]]
name = "south_spawn"
tags = ["spawn"]
team = "south"
pos = [0, 60]
params = { from = "end" }

[[units]]
unit_type = "core"
team = "north"
pos = [0, -54]

[[units]]
