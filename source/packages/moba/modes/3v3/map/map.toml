# Two lanes, west and east, from the north base at z = -60 to the south base at z = 60, and the
# jungle between them. Points are [x, z] in meters on the ground plane.

# The map runs from x = −48 to 48 and z = −68 to 68, and sight reveals 1 m cells over it.
[bounds]
min = [-48, -68]
max = [48, 68]

[grid]
cell = "1.0"

# Units plan their routes over half-meter cells.
[navigation]
cell = "0.5"

[[paths]]
name = "west"
points = [[-6, -50], [-36, -36], [-40, 0], [-36, 36], [-6, 50]]

[[paths]]
name = "east"
points = [[6, -50], [36, -36], [40, 0], [36, 36], [6, 50]]

[spawns]
north = [0, -60]
south = [0, 60]

