script = "scripts/mode.rhai"
assist_window_ms = 10000
# The words of this game: its damage kinds, and what its heroes spend.
damage_kinds = ["physical", "magic", "true"]
resources = ["mana", "energy"]

# Every stat its units carry, those the engine reads among them: how each combines, and its
# limits. A rate is a fraction: 0.1 adds a tenth.
[stats]
health = {}
health_regen = {}
resource = {}
resource_regen = {}
attack_damage = {}
ability_power = {}
armor = {}
magic_resist = {}
armor_pen = {}
magic_pen = {}
move_speed = {}
physical_block = {}
attack_damage_pct = { min = -1 }
ability_power_pct = { min = -1 }
attack_speed_pct = { min = -1 }
move_speed_pct = { min = -1 }
healing_received_pct = { min = -1 }
damage_dealt_pct = { min = -1 }
attack_speed = { max = "2.5" }
crit_chance = { min = 0, max = 1 }
armor_pen_pct = { min = 0, max = 1 }
magic_pen_pct = { min = 0, max = 1 }
life_steal = { min = 0, max = 1 }
spell_vamp = { min = 0, max = 1 }
cooldown_reduction = { min = 0, max = "0.4" }
slow = { combine = "highest", min = 0, max = "0.99" }

[inputs]
hero = "string"
spells = "string_list"

[state]
phase = { type = "string", default = "pick", sync = "all" }
first_blood = { type = "bool", default = false, sync = "all" }

[params]
pick_ms = 60000
first_wave_ms = 60000
wave_ms = 30000
wave = ["melee_creep", "melee_creep", "melee_creep", "caster_creep", "caster_creep", "caster_creep"]
income_ms = 5000
income_gold = 8
respawn_base_ms = 5000
respawn_per_level_ms = 2500
kill_gold = 300
first_blood_gold = 100
assist_gold = 150
hero_xp_base = 150
hero_xp_per_level = 25
xp_radius = "16.0"
inhibitor_respawn_ms = 240000
camp_respawn_ms = 60000
warden_respawn_ms = 360000

[modifiers.warden_blessing]
duration_ms = 180000
stats = { attack_damage_pct = "0.1", ability_power_pct = "0.1" }
