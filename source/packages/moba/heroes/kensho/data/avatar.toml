name = "hero-name"
tags = ["fighter"]
pools = ["health", "mana"]
tracks = ["level"]
passive = "twin_cut"
slots = { basic = ["flicker_strike", "still_mind", "honed_edge"], ultimate = ["unbound"], weapon = ["attack"] }

[combat]

[collision]
radius = "0.5"

[vision]
sight_range = "12.0"

[stats]
health = { base = 444, per_level = 86 }
health_regen = { base = "1.4", per_level = "0.13" }
mana = { base = 199, per_level = 36 }
mana_regen = { base = "1.3", per_level = "0.09" }
attack_damage = { base = 55, per_level = "3.1" }
attack_speed = { base = "0.679", per_level = "0.027" }
armor = { base = "16.3", per_level = "3.7" }
magic_resist = { base = 30, per_level = "1.25" }
move_speed = { base = "3.55" }

[modifiers.twin_cut]
script = "scripts/twin_cut.rhai"
stacks_expire_ms = 4000

[modifiers.twin_cut.params]
every = 7

[actions.flicker_strike]
script = "scripts/flicker_strike.rhai"
targeting = "enemies"
range = "6.0"
cooldown_ms = [18000, 16000, 14000, 12000, 10000]
cost = { mana = [60, 70, 80, 90, 100] }

[actions.flicker_strike.params]
strikes = 4
hop_radius = "6.0"
damage = { base = [100, 150, 200, 250, 300], attack_damage = "1.0" }
minion_bonus = [75, 100, 125, 150, 175]
minion_bonus_chance = "0.3"

[modifiers.flicker_strike]
script = "scripts/flicker_strike.rhai"
interval_ms = 180
tags = ["untargetable"]

[modifiers.flicker_strike.state]
last = { type = "entity" }
struck = { type = "entity_list" }
left = { type = "int", default = 0 }

[actions.still_mind]
script = "scripts/still_mind.rhai"
targeting = "none"
cooldown_ms = 35000
cost = { mana = [50, 65, 80, 95, 110] }
channel = { duration_ms = 5000, tick_ms = 500 }
hold = "still_mind"

[actions.still_mind.params]
heal_per_tick = { base = [20, 35, 50, 65, 80], ability_power = "0.1" }
guard = [30, 45, 60, 75, 90]

[modifiers.still_mind]
stats = { armor = { param = "guard" }, magic_resist = { param = "guard" } }

[actions.honed_edge]
script = "scripts/honed_edge.rhai"
targeting = "none"
cooldown_ms = [25000, 23000, 21000, 19000, 17000]
passive_modifier = "honed_edge"
passive_while_ready = true

[actions.honed_edge.params]
bonus_ad = [15, 20, 25, 30, 35]
active_ad = [30, 40, 50, 60, 70]

[modifiers.honed_edge]
stats = { attack_damage = { param = "bonus_ad" } }

[modifiers.honed_edge_active]
duration_ms = 5000
stats = { attack_damage = { param = "active_ad" } }

[actions.unbound]
script = "scripts/unbound.rhai"
targeting = "none"
cooldown_ms = 75000
cost = { mana = 100 }

[actions.unbound.params]
duration_ms = [8000, 10000, 12000]
attack_speed = ["0.4", "0.55", "0.7"]
move_speed = ["0.25", "0.35", "0.45"]
cooldown_cut = "0.7"

[modifiers.unbound]
script = "scripts/unbound.rhai"
duration_ms = { param = "duration_ms" }
tags = ["slow_immune"]
stats = { attack_speed = { pct = { param = "attack_speed" } }, move_speed = { pct = { param = "move_speed" } } }

[actions.attack]
kind = "attack"
targeting = "enemies"
range = "1.25"
windup_ms = 250
rate = "attack_speed"
damage = "attack_damage"
damage_kind = "physical"
