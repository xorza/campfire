name = "Cinder"
tags = ["mage"]
pools = ["health", "mana"]
slots = { basic = ["fire_lance", "eruption", "wildfire"], ultimate = ["chain_fire"] }

[combat.attack]
range = "5.5"
windup_ms = 300
projectile_speed = "20"

[collision]
radius = "0.5"

[vision]
sight_range = "12.0"

[stats]
health = { base = 380, per_level = 76 }
health_regen = { base = "1.1", per_level = "0.11" }
mana = { base = 250, per_level = 45 }
mana_regen = { base = "1.5", per_level = "0.12" }
attack_damage = { base = 51, per_level = 3 }
attack_speed = { base = "0.625", per_level = "0.0136" }
armor = { base = 12, per_level = "3.5" }
magic_resist = { base = 30 }
move_speed = { base = "3.4" }

[modifiers.kindle]
script = "scripts/kindle.rhai"
duration_ms = 4000
interval_ms = 1000

[modifiers.kindle.params]
burn_share = "0.02"

[actions.fire_lance]
script = "scripts/fire_lance.rhai"
targeting = "direction"
range = "10.5"
cooldown_ms = [10000, 9000, 8000, 7000, 6000]
cost = { mana = 50 }
cast_time_ms = 250
projectile = { speed = "16", width = "1.2", stop_on_hit = true }

[actions.fire_lance.params]
damage = { base = [80, 120, 160, 200, 240], ability_power = "0.65" }
stun_ms = 2000

[actions.eruption]
script = "scripts/eruption.rhai"
targeting = "point"
range = "9.0"
cooldown_ms = 10000
cost = { mana = [70, 75, 80, 85, 90] }
cast_time_ms = 250
area = { radius = "2.4", delay_ms = 625, affects = "enemies" }

[actions.eruption.params]
damage = { base = [75, 120, 165, 210, 255], ability_power = "0.6" }
ablaze_bonus = "1.25"

[actions.wildfire]
script = "scripts/wildfire.rhai"
targeting = "enemies"
range = "6.25"
cooldown_ms = [12000, 11000, 10000, 9000, 8000]
cost = { mana = [70, 75, 80, 85, 90] }

[actions.wildfire.params]
damage = { base = [70, 105, 140, 175, 210], ability_power = "0.55" }
spread_radius = "3.0"
spread_damage = { base = [70, 105, 140, 175, 210], ability_power = "0.55" }

[actions.chain_fire]
script = "scripts/chain_fire.rhai"
targeting = "enemies"
range = "7.5"
cooldown_ms = [105000, 90000, 75000]
cost = { mana = [100, 150, 200] }
projectile = { speed = "10" }

[actions.chain_fire.params]
bounce_radius = "5.0"
damage = { base = [150, 250, 350], ability_power = "0.5" }

[actions.chain_fire.projectile_state]
bounces_left = { type = "int", default = 4 }

# A stun: its time comes from the call that applies it.
[modifiers.stun]
tags = ["stunned"]
