[abilities.cyclone.projectile_state]
charge = { type = "num", default = 0 }

[abilities.gust]
script = "scripts/gust.rhai"
targeting = "enemies"
range = "6.0"
cooldown_ms = 8000
cost = [60, 70, 80, 90, 100]
passive_modifier = "gust_speed"
