# Zero Hour's fixed mode data, which each imported Zero Hour mode's own lies over: what is the
# same in every install, as the game's code fixes it.

# What its players earn and spend.
resources = ["money"]
# The params of a waypoint's marker: its name, and the player slot of a start or a rally, from 0,
# which its scripts find a slot's start and rally by; a map of no waypoint has them on no marker.
marker_params = ["name", "player_slot"]

# The stats its units drive by, their acceleration a mover's (driving.md, A type moves by its
# movement model), the life they live by, the rate of fire a stage of continuous fire adds to,
# which a weapon of one divides its period by, plus 1, the damage and the rate of fire a level
# of veterancy adds to every weapon, as `Object::onVeterancyLevelChanged` sets its weapon bonus
# condition, and the range and the damage a garrison adds to every weapon of its riders, as
# `GarrisonContain::onContaining` sets `GARRISONED`.
[stats]
move_speed = {}
turn_rate = {}
acceleration = {}
life = {}
rate_of_fire = {}
veterancy_damage = {}
veterancy_rate = {}
garrison_range = {}
garrison_damage = {}

[pools.life]
max = "life"

# The game's damage types, as its INI names them, in lower case, in the order of its
# `DamageType`, and the pool a damage takes.
[combat]
damage_kinds = [
    "explosion",
    "crush",
    "armor_piercing",
    "small_arms",
    "gattling",
    "radiation",
    "flame",
    "laser",
    "sniper",
    "poison",
    "healing",
    "unresistable",
    "water",
    "deploy",
    "surrender",
    "hack",
    "kill_pilot",
    "penalty",
    "falling",
    "melee",
    "disarm",
    "hazard_cleanup",
    "particle_beam",
    "toppling",
    "infantry_missile",
    "aurora_bomb",
    "land_mine",
    "jet_missiles",
    "stealthjet_missiles",
    "molotov_cocktail",
    "comanche_vulcan",
    "subdual_missile",
    "subdual_vehicle",
    "subdual_building",
    "subdual_unresistable",
    "microwave",
    "kill_garrisoned",
    "status",
]
life = "life"

# The tags its rules name: of a building that counts for victory, of a structure, of a wall, of a
# base defense, and of infantry; and the tags an upgrade gives as it sets the armor set's and the
# weapon set's `PLAYER_UPGRADE`, which a type's armors and weapons test.
[tags.counts_for_victory]

[tags.structure]

[tags.wall]

[tags.base_defense]

[tags.infantry]

# A vehicle, of `KindOf = VEHICLE`, whose powers' bursts heal it.
[tags.vehicle]

# An aircraft, of `KindOf = AIRCRAFT`, which a weapon may prefer and a Chinook refuses.
[tags.aircraft]

# A huge vehicle, of `KindOf = HUGE_VEHICLE`, which a Chinook refuses, and one of `NO_GARRISON`,
# which no garrison takes.
[tags.huge_vehicle]

[tags.no_garrison]

# The tag of a unit that gives its player a radar, which a `RadarUpgrade` gives and the minimap shows
# by.
[tags.radar]

[tags.armor_upgrade]

[tags.weapon_upgrade]

# The tags of a unit at each stage of its continuous fire, and of one fallen from a stage, which the
# stages' and the fall's modifiers give and its looks' `CONTINUOUS_FIRE_*` conditions test.
[tags.continuous_fire_mean]

[tags.continuous_fire_fast]

[tags.continuous_fire_slow]

# The tags of the markers its players start at and their starting units rally at; and its layers,
# the ground and the air its helicopters fly in (04-capabilities/navigation.md, Fliers share a layer).
[navigation]
spawn_tags = ["start", "rally"]
layers = ["ground", "air"]

# A skirmish's end, as the original's `VictoryConditions` keeps it: a player whose last living
# building that counts for victory dies is out of play, and its other units die, as
# `Player::killPlayer` kills them; the last team with such buildings wins.
[victory]
counts = "counts_for_victory"
defeat = "kill_all"

# A kill pays the killer's player its share of the victim's build cost, rounded up, as the
# original's `Player::doBountyForKill` does, and none for a building under construction; the share
# starts at none, until a Cash Bounty raises it.
[bounty]
killer = "enemies"
victim = "all:!constructing"

# The slot kinds of its units' weapons, of their command buttons, and of the entry a rider runs.
[[slots]]
name = "weapon"

[[slots]]
name = "command"

[[slots]]
name = "use"

# What every unit type of the game shares, as its code fixes it, under each type's own section.
# A unit despawns as it dies.
[defaults.combat]
on_death = "despawn"

# A human player's idle unit takes a hostile unit, but of the structures only a base defense and one
# that holds riders, as `PartitionFilterRejectBuildings` keeps one that can attack, which a garrison
# makes its building; a type of `ATTACK_BUILDINGS` names every hostile unit of its own.
[defaults.acquire]
targets = ["hostiles:!structure", "hostiles:base_defense", "hostiles:holding"]

# A turret turns the weapons of the weapon slot kind, and starts an attack within the original's
# tolerance of its aim, 0.035 radians (`TurretAIAimTurretState::update`), in degrees, which reads
# to the nearest bit.
[defaults.turret]
tolerance_deg = "2.0053522829578814"
slot = "weapon"

# Every player holds each unit's slot times and clips, as the original draws every unit's pre-attack,
# shot, wait and reload, which its look's conditions derive from them (02-engine-core.md, The
# client derives an attack's phase).
[visibility]
cooldowns = ["allies", "enemies", "spectators"]
