# The builder bot of Tournament Desert's player 2, at `Player_2_Start` (1011, -2103), with the money of
# a skirmish's 50,000: its dozer builds a power plant, a barracks, a supply center and a war factory
# beside and behind its command center, away from player 1's way; the barracks trains infantry, the
# factory vehicles, and the center a second dozer, after the last build, so no build goes to it. It
# orders no attack and no move. Each slot is the train or the build its unit type's action of
# that name holds. Play it with `--server-bot 1=<this file>`.

# The dozer's builds, at America's angle of -135 degrees.
[[order]]
tick = 1
units = "americavehicledozer"
directive.orders.build = { slot = "build_americapowerplant", target.point = { at = [861, -2103], angle = -135 } }

[[order]]
tick = 600
units = "americavehicledozer"
directive.orders.build = { slot = "build_americabarracks", target.point = { at = [861, -2303], angle = -135 } }

[[order]]
tick = 1200
units = "americavehicledozer"
directive.orders.build = { slot = "build_americasupplycenter", target.point = { at = [1161, -2103], angle = -135 } }

