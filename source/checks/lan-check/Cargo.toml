[package]
name = "campfire-lan-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.campfire]
kind = "check"

[dependencies]
campfire-bots.workspace = true
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-log = { workspace = true, features = ["start"] }
campfire-net.workspace = true
campfire-net-payload.workspace = true
campfire-protocol.workspace = true
campfire-store.workspace = true
campfire-verifier.workspace = true

clap = { workspace = true, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
derive_more = { workspace = true, features = ["display"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
campfire-store = { workspace = true, features = ["internals"] }
campfire-threads = { workspace = true, features = ["internals"] }

[lints]
workspace = true
