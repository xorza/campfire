[package]
name = "campfire-vocabulary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.campfire]
kind = "check"

[dependencies]
campfire-common.workspace = true
campfire-logging.workspace = true
campfire-store.workspace = true

clap = { workspace = true, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["derive", "full", "parsing", "printing", "proc-macro"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
campfire-store = { workspace = true, features = ["internals"] }

[lints]
workspace = true
