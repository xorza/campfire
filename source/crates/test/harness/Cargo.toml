[package]
name = "campfire-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.campfire]
kind = "test"

# The session harness and the tests and benches that play matches through it with no network: the
# top crate of the session's tests, as `campfire-capabilities` is of the capabilities'. All of it
# is test code, so it has no `internals` of its own: it depends, with their `internals`, on every
# crate its library names, and dev-depends so on each crate that only its tests name.
[dependencies]
campfire-actions = { workspace = true, features = ["internals"] }
campfire-capabilities = { workspace = true, features = ["internals"] }
campfire-combat = { workspace = true, features = ["internals"] }
campfire-common.workspace = true
campfire-declare = { workspace = true, features = ["internals"] }
campfire-geometry = { workspace = true, features = ["internals"] }
campfire-items = { workspace = true, features = ["internals"] }
campfire-log = { workspace = true, features = ["internals"] }
campfire-math = { workspace = true, features = ["internals"] }
campfire-measure.workspace = true
campfire-mode = { workspace = true, features = ["internals"] }
campfire-navigation = { workspace = true, features = ["internals"] }
campfire-orders = { workspace = true, features = ["internals"] }
campfire-package = { workspace = true, features = ["internals"] }
campfire-package-disk = { workspace = true, features = ["internals"] }
campfire-players = { workspace = true, features = ["internals"] }
campfire-production = { workspace = true, features = ["internals"] }
campfire-progression = { workspace = true, features = ["internals"] }
campfire-protocol = { workspace = true, features = ["internals"] }
campfire-runner = { workspace = true, features = ["internals"] }
campfire-script = { workspace = true, features = ["internals"] }
campfire-sim = { workspace = true, features = ["internals"] }
campfire-stats = { workspace = true, features = ["internals"] }
campfire-store = { workspace = true, features = ["internals"] }
campfire-test-packages.workspace = true
campfire-units = { workspace = true, features = ["internals"] }
campfire-values = { workspace = true, features = ["internals"] }
campfire-vision = { workspace = true, features = ["internals"] }

bevy_ecs = { workspace = true, features = ["std"] }
criterion = { workspace = true, features = ["cargo_bench_support"] }
secp256k1 = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-areas = { workspace = true, features = ["internals"] }
campfire-codec = { workspace = true, features = ["internals"] }
campfire-deliveries = { workspace = true, features = ["internals"] }
campfire-interaction = { workspace = true, features = ["internals"] }
campfire-projectiles = { workspace = true, features = ["internals"] }
campfire-verifier = { workspace = true, features = ["internals"] }

[lints]
workspace = true

[[test]]
name = "tests"
path = "tests/mod.rs"

[lib]
bench = false

[[bench]]
name = "harness"
harness = false

# Its own binary, as its counting allocator is the process's.
[[bench]]
name = "allocations"
harness = false
