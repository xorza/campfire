[package]
name = "campfire-measure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.campfire]
kind = "test"

# What the workspace's tests and benches measure with; a crate's tests and benches take it, its
# benches behind `internals`, as they take criterion.
[dependencies]
backtrace.workspace = true
criterion.workspace = true
tracing.workspace = true

[dev-dependencies]
campfire-store = { workspace = true, features = ["internals"] }

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

[lints]
workspace = true
