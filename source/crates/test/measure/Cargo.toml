[package]
name = "campfire-measure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.campfire]
kind = "test"

# What the workspace's tests and benches measure with; a crate's tests and benches take it, its
# benches behind `internals`, as they take criterion.
[dependencies]
backtrace = { workspace = true, features = ["std"] }
criterion = { workspace = true, features = ["cargo_bench_support"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
campfire-threads = { workspace = true, features = ["internals"] }

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

[lints]
workspace = true
