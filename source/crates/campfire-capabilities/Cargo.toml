[package]
name = "campfire-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
bench = ["dep:criterion", "internals"]
internals = []

[dependencies]
campfire-common.workspace = true
campfire-math.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true

bevy_ecs.workspace = true
criterion = { workspace = true, optional = true }
derive_more.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }
toml.workspace = true

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "capabilities"
harness = false
required-features = ["bench"]

[lints]
workspace = true
