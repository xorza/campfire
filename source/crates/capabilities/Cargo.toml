[package]
name = "campfire-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = [
    "campfire-abilities/internals",
    "campfire-actions/internals",
    "campfire-areas/internals",
    "campfire-combat/internals",
    "campfire-core/internals",
    "campfire-deliveries/internals",
    "campfire-geometry/internals",
    "campfire-items/internals",
    "campfire-mode/internals",
    "campfire-navigation/internals",
    "campfire-orders/internals",
    "campfire-production/internals",
    "campfire-progression/internals",
    "campfire-projectiles/internals",
    "campfire-sim/internals",
    "campfire-state-types/internals",
    "campfire-stats/internals",
    "campfire-values/internals",
    "campfire-visibility/internals",
    "campfire-vision/internals",
    "dep:campfire-log",
    "dep:campfire-math",
    "dep:criterion",
]

[dependencies]
campfire-abilities.workspace = true
campfire-actions.workspace = true
campfire-areas.workspace = true
campfire-codec.workspace = true
campfire-combat.workspace = true
campfire-common.workspace = true
campfire-core.workspace = true
campfire-deliveries.workspace = true
campfire-geometry.workspace = true
campfire-items.workspace = true
campfire-log = { workspace = true, optional = true, features = ["internals"] }
campfire-math = { workspace = true, optional = true }
campfire-mode.workspace = true
campfire-navigation.workspace = true
campfire-orders.workspace = true
campfire-production.workspace = true
campfire-progression.workspace = true
campfire-projectiles.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-state-types.workspace = true
campfire-stats.workspace = true
campfire-values.workspace = true
campfire-visibility.workspace = true
campfire-vision.workspace = true

bevy_ecs.workspace = true
criterion = { workspace = true, optional = true }
derive_more.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-capabilities = { workspace = true, features = ["internals"] }
campfire-log = { workspace = true, features = ["internals"] }
campfire-math = { workspace = true, features = ["internals"] }
campfire-sim = { workspace = true, features = ["internals"] }
campfire-store = { workspace = true, features = ["internals"] }

toml.workspace = true

[lints]
workspace = true

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "capabilities"
harness = false
required-features = ["internals"]
