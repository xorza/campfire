[package]
name = "campfire-units"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "campfire-declare/internals",
    "campfire-geometry/internals",
    "campfire-math/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-state-types/internals",
    "campfire-values/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-declare.workspace = true
campfire-geometry.workspace = true
campfire-math.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-state-types.workspace = true
campfire-values = { workspace = true, features = ["ecs"] }
campfire-visibility.workspace = true

bevy_ecs = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-units = { workspace = true, features = ["internals"] }

[lints]
workspace = true
