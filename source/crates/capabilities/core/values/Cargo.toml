[package]
name = "campfire-values"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
# The ECS derives and impls of a unit's team, type and tags and of the teams' relations, for the
# glue crates that hold them as components
ecs = [
    "dep:bevy_ecs",
    "dep:campfire-sim",
    "dep:campfire-states",
    "dep:campfire-visibility",
]
internals = [
    "campfire-math/internals",
    "campfire-sim?/internals",
    "campfire-states?/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-math.workspace = true
campfire-sim = { workspace = true, optional = true }
campfire-states = { workspace = true, optional = true }
campfire-visibility = { workspace = true, optional = true }

bevy_ecs = { workspace = true, features = ["std"], optional = true }
derive_more = { workspace = true, features = ["display"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-values = { workspace = true, features = ["internals"] }

[lints]
workspace = true
