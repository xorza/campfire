[package]
name = "campfire-visibility"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "campfire-state-types/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-state-types.workspace = true

bevy_ecs = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-visibility = { workspace = true, features = ["internals"] }

[lints]
workspace = true
