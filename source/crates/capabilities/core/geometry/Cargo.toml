[package]
name = "campfire-geometry"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = [
    "campfire-common/internals",
    "campfire-math/internals",
    "campfire-sim/internals",
    "campfire-values/internals",
    "dep:campfire-common",
    "dep:criterion",
]

[dependencies]
campfire-common = { workspace = true, optional = true }
campfire-math.workspace = true
campfire-sim.workspace = true
campfire-values.workspace = true

criterion = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-codec.workspace = true
campfire-geometry = { workspace = true, features = ["internals"] }

[lints]
workspace = true

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "geometry"
harness = false
required-features = ["internals"]
