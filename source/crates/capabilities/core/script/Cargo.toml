[package]
name = "campfire-script"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = ["dep:criterion"]

[dependencies]
campfire-math.workspace = true

criterion = { workspace = true, optional = true }
rhai.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
campfire-script = { workspace = true, features = ["internals"] }

[lints]
workspace = true

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "script"
harness = false
required-features = ["internals"]
