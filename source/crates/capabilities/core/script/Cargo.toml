[package]
name = "campfire-script"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "dep:campfire-measure",
    "campfire-codec/internals",
    "campfire-geometry/internals",
    "campfire-math/internals",
    "campfire-sim/internals",
    "campfire-values/internals",
    "dep:criterion",
]

[dependencies]
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-geometry.workspace = true
campfire-math.workspace = true
campfire-sim.workspace = true
campfire-values = { workspace = true, features = ["ecs"] }
campfire-visibility.workspace = true

bevy_ecs = { workspace = true, features = ["std"] }
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
derive_more = { workspace = true, features = ["display"] }
rhai = { workspace = true, features = ["internals", "no_closure", "no_float", "no_time", "std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-script = { workspace = true, features = ["internals"] }

[lints]
workspace = true


[[bench]]
name = "script"
harness = false
required-features = ["internals"]
