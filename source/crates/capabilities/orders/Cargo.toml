[package]
name = "campfire-orders"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
internals = [
    "campfire-actions/internals",
    "campfire-core/internals",
    "campfire-geometry/internals",
    "campfire-math/internals",
    "campfire-navigation/internals",
    "campfire-production/internals",
    "campfire-sim/internals",
    "campfire-state-types/internals",
    "campfire-stats/internals",
    "campfire-values/internals",
    "campfire-vision/internals",
    "dep:campfire-log",
]

[dependencies]
campfire-actions.workspace = true
campfire-common.workspace = true
campfire-core.workspace = true
campfire-geometry.workspace = true
campfire-log = { workspace = true, optional = true, features = ["internals"] }
campfire-math.workspace = true
campfire-navigation.workspace = true
campfire-production.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-state-types.workspace = true
campfire-stats.workspace = true
campfire-values.workspace = true
campfire-vision.workspace = true

bevy_ecs.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-capabilities = { workspace = true, features = ["internals"] }
campfire-codec.workspace = true
campfire-combat = { workspace = true, features = ["internals"] }
campfire-deliveries = { workspace = true, features = ["internals"] }
campfire-log = { workspace = true, features = ["internals"] }
campfire-math = { workspace = true, features = ["internals"] }
campfire-mode = { workspace = true, features = ["internals"] }
campfire-orders = { workspace = true, features = ["internals"] }
campfire-sim = { workspace = true, features = ["internals"] }
campfire-store = { workspace = true, features = ["internals"] }
