[package]
name = "campfire-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "dep:campfire-measure",
    "campfire-abilities/internals",
    "campfire-actions/internals",
    "campfire-areas/internals",
    "campfire-codec/internals",
    "campfire-combat/internals",
    "campfire-declarations/internals",
    "campfire-deliveries/internals",
    "dep:campfire-geometry",
    "campfire-geometry/internals",
    "campfire-airfields/internals",
    "campfire-interaction/internals",
    "campfire-items/internals",
    "dep:campfire-log",
    "campfire-log/internals",
    "campfire-math/internals",
    "campfire-mode/internals",
    "campfire-navigation/internals",
    "campfire-orders/internals",
    "campfire-players/internals",
    "campfire-production/internals",
    "campfire-progression/internals",
    "campfire-projectiles/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-states/internals",
    "campfire-stats/internals",
    "campfire-units/internals",
    "campfire-values/internals",
    "campfire-vision/internals",
    "dep:criterion",
]

[dependencies]
campfire-abilities.workspace = true
campfire-actions.workspace = true
campfire-areas.workspace = true
campfire-codec.workspace = true
campfire-combat.workspace = true
campfire-common.workspace = true
campfire-declarations.workspace = true
campfire-deliveries.workspace = true
campfire-geometry = { workspace = true, optional = true }
campfire-airfields.workspace = true
campfire-interaction.workspace = true
campfire-items.workspace = true
campfire-log = { workspace = true, optional = true }
campfire-math.workspace = true
campfire-mode.workspace = true
campfire-navigation.workspace = true
campfire-orders.workspace = true
campfire-players.workspace = true
campfire-production.workspace = true
campfire-progression.workspace = true
campfire-projectiles.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-states.workspace = true
campfire-stats.workspace = true
campfire-units.workspace = true
campfire-values = { workspace = true, features = ["ecs"] }
campfire-visibility.workspace = true
campfire-vision.workspace = true

bevy_ecs = { workspace = true, features = ["std"] }
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-capabilities = { workspace = true, features = ["internals"] }
campfire-store = { workspace = true, features = ["internals"] }
campfire-threads = { workspace = true, features = ["internals"] }

[lints]
workspace = true


[[bench]]
name = "capabilities"
harness = false
required-features = ["internals"]

[[test]]
name = "tests"
path = "tests/mod.rs"

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"
