[package]
name = "campfire-geometry"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
internals = [
    "dep:campfire-common",
    "dep:campfire-measure",
    "campfire-math/internals",
    "dep:criterion",
]

[dependencies]
campfire-common = { workspace = true, optional = true }
campfire-math.workspace = true

campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-geometry = { workspace = true, features = ["internals"] }

[lints]
workspace = true


[[bench]]
name = "geometry"
harness = false
required-features = ["internals"]
