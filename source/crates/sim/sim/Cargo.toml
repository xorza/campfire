[package]
name = "campfire-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[package.metadata.campfire]
kind = "glue"

[features]
# Bevy's `debug` names each type in a panic and an archetype, for tests and checks alone
# (02-engine-core.md, Tests and checks name Bevy's types).
internals = [
    "bevy_ecs/debug",
    "dep:campfire-measure",
    "campfire-codec/internals",
    "campfire-math/internals",
    "campfire-schedule/internals",
    "dep:criterion",
]

[dependencies]
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-math.workspace = true
campfire-schedule.workspace = true

arrayvec.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_platform.workspace = true
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }
campfire-sim = { workspace = true, features = ["internals"] }

blake3 = { workspace = true, features = ["std"] }

[[test]]
name = "tests"
path = "tests/mod.rs"


[[bench]]
name = "sim"
harness = false
required-features = ["internals"]

[lints]
workspace = true
