[package]
name = "campfire-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "campfire-codec/internals",
    "campfire-common/internals",
    "campfire-math/internals",
    "campfire-schedule/internals",
    "dep:criterion",
]

[dependencies]
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-math.workspace = true
campfire-schedule.workspace = true

arrayvec.workspace = true
bevy_ecs.workspace = true
blake3.workspace = true
criterion = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }
campfire-sim = { workspace = true, features = ["internals"] }

[[test]]
name = "tests"
path = "tests/mod.rs"

[lib]
bench = false

[[bench]]
name = "sim"
harness = false
required-features = ["internals"]

[lints]
workspace = true
