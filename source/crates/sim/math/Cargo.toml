[package]
name = "campfire-math"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
internals = [
    "dep:campfire-measure",
    "dep:criterion",
]

[dependencies]
campfire-common.workspace = true

blake3 = { workspace = true, features = ["std"] }
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-math = { workspace = true, features = ["internals"] }
proptest = { workspace = true, features = ["std"] }


[[bench]]
name = "math"
harness = false
required-features = ["internals"]

[lints]
workspace = true
