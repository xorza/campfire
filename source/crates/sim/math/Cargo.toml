[package]
name = "campfire-math"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
internals = [
    "dep:campfire-measure",
    "dep:criterion",
]

[dependencies]
campfire-common.workspace = true

blake3.workspace = true
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-math = { workspace = true, features = ["internals"] }
proptest.workspace = true

[lib]
bench = false

[[bench]]
name = "math"
harness = false
required-features = ["internals"]

[lints]
workspace = true
