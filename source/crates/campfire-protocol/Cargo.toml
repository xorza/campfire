[package]
name = "campfire-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = []
bench = ["internals", "dep:criterion"]

[dependencies]
campfire-common.workspace = true

blake3.workspace = true
criterion = { workspace = true, optional = true }
derive_more.workspace = true
nostr.workspace = true
postcard.workspace = true
secp256k1 = { workspace = true, features = ["serde"] }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "protocol"
harness = false
required-features = ["bench"]

[lints]
workspace = true
