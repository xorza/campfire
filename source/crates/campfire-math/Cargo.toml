[package]
name = "campfire-math"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = []
bench = ["internals", "dep:criterion"]

[dependencies]
campfire-common.workspace = true

blake3.workspace = true
criterion = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "math"
harness = false
required-features = ["bench"]

[lints]
workspace = true
