[package]
name = "campfire-net-packets"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
# The packet sessions' counts, for the tests of every layer above
internals = [
    "campfire-net-bytes/internals",
    "dep:campfire-store",
    "campfire-store/internals",
    "campfire-net-emulator/internals",
    "campfire-net-payload/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-store = { workspace = true, optional = true }
campfire-net-core.workspace = true
campfire-net-bytes.workspace = true
campfire-net-emulator.workspace = true
campfire-net-payload.workspace = true

bytes.workspace = true
thiserror.workspace = true

bevy_platform = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-math = { workspace = true, features = ["internals"] }
campfire-net-packets = { workspace = true, features = ["internals"] }

[lints]
workspace = true
