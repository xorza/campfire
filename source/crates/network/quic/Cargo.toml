[package]
name = "campfire-quic"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "campfire-common/internals",
    "campfire-store/internals",
    "dep:criterion",
]

[dependencies]
campfire-common.workspace = true
campfire-store.workspace = true

attohttpc.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bytes.workspace = true
criterion = { workspace = true, optional = true }
igd-next.workspace = true
lightyear.workspace = true
netdev.workspace = true
polling.workspace = true
quinn-proto.workspace = true
quinn-udp.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
xmltree.workspace = true
zeroize.workspace = true

[dev-dependencies]
bevy_state.workspace = true
bevy_time.workspace = true
campfire-quic = { workspace = true, features = ["internals"] }
lightyear_serde.workspace = true

[lib]
bench = false

[[bench]]
name = "quic"
harness = false
required-features = ["internals"]

[[test]]
name = "alloc"
path = "tests/alloc/main.rs"
required-features = ["internals"]

[lints]
workspace = true
