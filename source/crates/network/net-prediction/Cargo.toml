[package]
name = "campfire-net-prediction"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "dep:serde",
    "campfire-net-interpolation/internals",
    "dep:campfire-net-stepper",
    "campfire-net-timeline/internals",
    "campfire-net-sync/internals",
    "campfire-net-replication/internals",
    "dep:campfire-math",
    "campfire-math/internals",
]

[dependencies]
campfire-math = { workspace = true, optional = true }
campfire-net-timeline.workspace = true
campfire-net-core.workspace = true
campfire-net-despawns.workspace = true
campfire-net-connection.workspace = true
campfire-net-stepper = { workspace = true, optional = true }
campfire-net-sync.workspace = true
campfire-net-replication.workspace = true
campfire-net-interpolation.workspace = true

bytes = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"], optional = true }
tracing = { workspace = true, features = ["attributes", "std"] }

bevy_app.workspace = true
bevy_curve = { workspace = true, features = ["std"] }
bevy_diagnostic.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_reflect = { workspace = true, features = ["smallvec", "std"] }
bevy_replicon = { workspace = true, features = ["client", "server"] }
bevy_time.workspace = true
bevy_utils = { workspace = true, features = ["debug"] }

[dev-dependencies]
campfire-codec = { workspace = true, features = ["internals"] }
campfire-net-emulator = { workspace = true, features = ["internals"] }
campfire-net-prediction = { workspace = true, features = ["internals"] }

serde = { workspace = true, features = ["derive", "rc", "std"] }

bevy.workspace = true
bevy_state.workspace = true

[lints]
workspace = true
