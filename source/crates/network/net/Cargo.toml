[package]
name = "campfire-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
# The stack's endpoints on the OS's UDP sockets, which an app that links over a network turns on;
# without it, `net` links in the process alone
udp = ["campfire-net-stack/udp"]
internals = [
    "campfire-bots/internals",
    "campfire-capabilities/internals",
    "campfire-codec/internals",
    "campfire-declare/internals",
    "campfire-log/internals",
    "campfire-math/internals",
    "campfire-mode/internals",
    "campfire-net-channels/internals",
    "campfire-net-emulator/internals",
    "campfire-net-endpoint/internals",
    "campfire-net-messages/internals",
    "campfire-net-packets/internals",
    "campfire-net-payload/internals",
    "campfire-net-prediction/internals",
    "campfire-net-replication/internals",
    "campfire-net-stack/internals",
    "campfire-net-sync/internals",
    "campfire-net-timeline/internals",
    "campfire-net-transport/internals",
    "campfire-net-udp/internals",
    "campfire-package/internals",
    "campfire-players/internals",
    "campfire-protocol/internals",
    "campfire-runner/internals",
    "campfire-schedule/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-state-types/internals",
    "campfire-store/internals",
    "campfire-units/internals",
    "campfire-values/internals",
    "campfire-visibility/internals",
    "campfire-vision/internals",
]

[dependencies]
campfire-bots.workspace = true
campfire-capabilities.workspace = true
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-declare.workspace = true
campfire-log.workspace = true
campfire-mode.workspace = true
campfire-package.workspace = true
campfire-players.workspace = true
campfire-protocol.workspace = true
campfire-math.workspace = true
campfire-net-channels.workspace = true
campfire-net-connection.workspace = true
campfire-net-core.workspace = true
campfire-net-emulator.workspace = true
campfire-net-endpoint.workspace = true
campfire-net-link.workspace = true
campfire-net-messages.workspace = true
campfire-net-packets.workspace = true
campfire-net-payload.workspace = true
campfire-net-prediction.workspace = true
campfire-net-replication.workspace = true
# Its emulated wires carry the singleplayer link
campfire-net-stack = { workspace = true, features = ["sim"] }
campfire-net-sync.workspace = true
campfire-net-timeline.workspace = true
campfire-net-transport.workspace = true
campfire-net-udp.workspace = true
campfire-runner.workspace = true
campfire-schedule.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-state-types.workspace = true
campfire-store.workspace = true
campfire-units.workspace = true
campfire-values.workspace = true
campfire-visibility.workspace = true
campfire-vision.workspace = true

bevy_app.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_replicon = { workspace = true, features = ["client", "server"] }
bevy_state.workspace = true
bevy_time.workspace = true
secp256k1 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
campfire-math = { workspace = true, features = ["internals"] }
campfire-net = { workspace = true, features = ["internals"] }
campfire-orders = { workspace = true, features = ["internals"] }
campfire-progression = { workspace = true, features = ["internals"] }
# Its tests read the workspace's test packages from disk.
campfire-test-packages.workspace = true

[lints]
workspace = true
