[package]
name = "campfire-net-udp"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
# The admission bench, for the benches of every layer above, and the test link that the tests of
# the sockets share
internals = [
    "dep:campfire-measure",
    "dep:criterion",
    "campfire-net-packets/internals",
    "campfire-net-emulator/internals",
    "campfire-net-payload/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-net-core.workspace = true
campfire-net-emulator.workspace = true
campfire-net-packets.workspace = true
campfire-net-payload.workspace = true

bytes = { workspace = true, features = ["std"] }
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
ring = { workspace = true, features = ["alloc", "dev_urandom_fallback"] }
rustls = { workspace = true, features = ["ring", "std"] }
thiserror = { workspace = true, features = ["std"] }
webpki-roots.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
campfire-net-bytes = { workspace = true, features = ["internals"] }
campfire-net-udp = { workspace = true, features = ["internals"] }


[[bench]]
name = "net-udp"
harness = false
required-features = ["internals"]

[lints]
workspace = true
