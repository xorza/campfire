[package]
name = "campfire-net-link"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[dependencies]
campfire-net-timeline.workspace = true
campfire-net-payload = { workspace = true, features = ["reflect"] }

tracing.workspace = true

bevy_app = { version = "=0.20.0", default-features = false }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_reflect = { version = "=0.20.0", default-features = false, features = ["std", "smallvec"] }

[dev-dependencies]
bytes.workspace = true

[lints]
workspace = true
