[package]
name = "campfire-net-timeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
# The clock's test fixtures, for the tests of every layer above
internals = ["campfire-math/internals"]

[dependencies]
campfire-math.workspace = true
campfire-net-core = { workspace = true, features = ["reflect"] }

tracing.workspace = true

bevy_app = { workspace = true, features = ["bevy_reflect"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_platform = { workspace = true, features = ["std"] }
bevy_reflect = { workspace = true, features = ["std", "smallvec"] }
bevy_time.workspace = true

[dev-dependencies]
campfire-net-timeline = { workspace = true, features = ["internals"] }

[lints]
workspace = true
