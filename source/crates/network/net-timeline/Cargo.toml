[package]
name = "campfire-net-timeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
# The clock's test fixtures, for the tests of every layer above
internals = []

[dependencies]
campfire-net-core = { workspace = true, features = ["ecs", "reflect"] }

tracing.workspace = true

bevy_app = { version = "=0.20.0", default-features = false, features = ["bevy_reflect"] }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_platform = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_reflect = { version = "=0.20.0", default-features = false, features = ["std", "smallvec"] }
bevy_time = { version = "=0.20.0", default-features = false }

[dev-dependencies]
campfire-net-timeline = { workspace = true, features = ["internals"] }

[lints]
workspace = true
