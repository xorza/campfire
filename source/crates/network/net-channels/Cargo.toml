[package]
name = "campfire-net-channels"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
compression_lz4 = ["dep:lz4_flex"]
# The channels' measurements and payload fixtures, and the fragment bench, for the tests and
# benches of every layer above
internals = [
    "dep:campfire-measure",
    "dep:criterion",
    "campfire-net-payload/internals",
    "campfire-net-bytes/internals",
]

[dependencies]
campfire-net-core.workspace = true
campfire-net-payload.workspace = true
campfire-net-bytes.workspace = true

bytes.workspace = true
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

bevy_platform = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-net-channels = { workspace = true, features = ["internals"] }

[lib]
bench = false

[[bench]]
name = "net-channels"
harness = false
required-features = ["internals"]

[lints]
workspace = true
