[package]
name = "campfire-net-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
# The sync layer's stack, for the tests and benches of every layer above
internals = [
    "campfire-net-transport/internals",
    "dep:campfire-net-stepper",
    "campfire-net-timeline/internals",
    "campfire-math/internals",
]

[dependencies]
campfire-math.workspace = true
campfire-net-timeline.workspace = true
campfire-net-core.workspace = true
campfire-net-link.workspace = true
campfire-net-connection.workspace = true
campfire-net-stepper = { workspace = true, optional = true }
campfire-net-transport.workspace = true

tracing.workspace = true

bevy_app.workspace = true
bevy_derive.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_reflect = { workspace = true, features = ["std", "smallvec"] }
bevy_time.workspace = true
bevy_utils = { workspace = true, features = ["debug"] }

[dev-dependencies]
campfire-net-sync = { workspace = true, features = ["internals"] }

[lints]
workspace = true
