    { path = "std::path::Path::is_file", reason = "read or list through campfire-store, and take `Missing`" },
    { path = "std::path::Path::is_dir", reason = "read or list through campfire-store, and take `Missing`" },
    { path = "std::path::Path::is_symlink", reason = "read or list through campfire-store, and take `Missing`" },
    { path = "std::path::Path::metadata", reason = "read or list through campfire-store, and take `Missing`" },
