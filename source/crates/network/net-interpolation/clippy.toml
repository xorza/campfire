    { path = "std::path::Path::canonicalize", reason = "read or list through campfire-store, and take `Missing`" },
    { path = "tempfile::tempdir", reason = "a test's files live in campfire_store::internals::TestDir" },
    { path = "tempfile::tempfile", reason = "a test's files live in campfire_store::internals::TestDir" },
    { path = "tempfile::tempdir_in", reason = "a test's files live in campfire_store::internals::TestDir" },
    { path = "tempfile::tempfile_in", reason = "a test's files live in campfire_store::internals::TestDir" },
    # campfire-threads alone starts a thread, through its Worker (02-engine-core.md, Threads are a crate of their own): a job of its list, named, closed and joined, and no crash hangs on it.
    { path = "std::thread::spawn", reason = "start threads through campfire_threads::Worker" },
    { path = "std::thread::scope", reason = "start threads through campfire_threads::Worker" },
    { path = "std::thread::Builder::spawn", reason = "start threads through campfire_threads::Worker" },
    { path = "std::thread::Builder::spawn_scoped", reason = "start threads through campfire_threads::Worker" },
    { path = "std::thread::Builder::spawn_unchecked", reason = "start threads through campfire_threads::Worker" },
    # campfire-codec alone calls the formats (02-engine-core.md, Serialization): one configuration, one canonical form and one error type for each, and every network message and replicated component encodes through it.
    { path = "postcard::to_allocvec", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_allocvec_cobs", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_stdvec", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_stdvec_cobs", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_extend", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_io", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_slice", reason = "encode and decode through campfire_codec" },
    { path = "postcard::to_slice_cobs", reason = "encode and decode through campfire_codec" },
    { path = "postcard::serialize_with_flavor", reason = "encode and decode through campfire_codec" },
    { path = "postcard::from_bytes", reason = "encode and decode through campfire_codec" },
    { path = "postcard::from_bytes_cobs", reason = "encode and decode through campfire_codec" },
    { path = "postcard::take_from_bytes", reason = "encode and decode through campfire_codec" },
    { path = "postcard::take_from_bytes_cobs", reason = "encode and decode through campfire_codec" },
    { path = "postcard::from_io", reason = "encode and decode through campfire_codec" },
    { path = "toml::from_str", reason = "encode and decode through campfire_codec" },
    { path = "toml::from_slice", reason = "encode and decode through campfire_codec" },
    { path = "toml::to_string", reason = "encode and decode through campfire_codec" },
    { path = "toml::to_string_pretty", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::from_str", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::from_slice", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::from_reader", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_string", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_string_pretty", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_vec", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_vec_pretty", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_writer", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_writer_pretty", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::from_value", reason = "encode and decode through campfire_codec" },
    { path = "serde_json::to_value", reason = "encode and decode through campfire_codec" },
    { path = "toml::Value::try_into", reason = "encode and decode through campfire_codec" },
    { path = "toml::map::Map::try_into", reason = "encode and decode through campfire_codec" },
    { path = "bevy_replicon::postcard_utils::to_extend_mut", reason = "encode and decode through campfire_codec" },
