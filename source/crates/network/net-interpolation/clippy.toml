allow-print-in-tests = true
allowed-wildcard-imports = ["x86_64", "aarch64", "arch"]
absolute-paths-allowed-crates = ["std", "core", "alloc"]
disallowed-types = [
    { path = "std::thread::LocalKey", reason = "state lives on an owner and travels by parameter" },
    # One source of the OS's random bytes, `getrandom` (14-workspace-alignment.md, One source of OS random bytes).
    { path = "ring::rand::SystemRandom", reason = "draw the OS's random bytes through getrandom, the one source" },
    # The bans fall in groups. A group with a proxy crate is called there alone: the proxy's crate
    # root exempts the lint, and every other crate goes through the proxy, which gives what it
    # needs. A group with no proxy is banned everywhere, and its reason names what to call
    # instead; only `LocalKey` above is exempt, at the head of a module whose state an outside API
    # keeps per thread. `campfire-rules`' tests hold each group and each exemption
    # (02-engine-core.md, Structural rules).
    # campfire-store alone touches the file system (02-engine-core.md, Storage): it reads, lists, checks and writes every file, so each read has its bound and each write its durability, and each failure names its path.
    { path = "std::fs::File", reason = "touch files through campfire-store" },
    { path = "std::fs::OpenOptions", reason = "touch files through campfire-store" },
    { path = "std::fs::DirBuilder", reason = "touch files through campfire-store" },
    { path = "std::fs::ReadDir", reason = "touch files through campfire-store" },
    { path = "std::fs::DirEntry", reason = "touch files through campfire-store" },
    { path = "std::fs::Metadata", reason = "touch files through campfire-store" },
    { path = "tempfile::TempDir", reason = "a test's files live in campfire_store::internals::TestDir" },
    { path = "tempfile::NamedTempFile", reason = "a test's files live in campfire_store::internals::TestDir" },
    { path = "tempfile::Builder", reason = "a test's files live in campfire_store::internals::TestDir" },
    { path = "tempfile::SpooledTempFile", reason = "a test's files live in campfire_store::internals::TestDir" },
    # campfire-app-threads alone sizes Bevy's task pools (02-engine-core.md, An app's threads are one plan).
    { path = "bevy_app::TaskPoolPlugin", reason = "size an app's pools through campfire_app_threads::OneThreadPlugins" },
    { path = "bevy_app::TaskPoolOptions", reason = "size an app's pools through campfire_app_threads::OneThreadPlugins" },
    # campfire-codec alone calls the formats (02-engine-core.md, Serialization): one configuration, one canonical form and one error type for each, and every network message and replicated component encodes through it.
    { path = "postcard::Serializer", reason = "encode through campfire_codec::Binary" },
    { path = "postcard::Deserializer", reason = "decode through campfire_codec::Binary" },
    { path = "toml::Serializer", reason = "write through campfire_codec::Toml" },
    { path = "toml::Deserializer", reason = "parse through campfire_codec::Toml" },
    { path = "toml::Value", reason = "read a table through campfire_codec::TomlTable" },
    { path = "toml::Table", reason = "read a table through campfire_codec::TomlTable" },
    { path = "serde_json::Serializer", reason = "write through campfire_codec::Json" },
    { path = "serde_json::Deserializer", reason = "parse through campfire_codec::Json" },
    { path = "serde_json::Value", reason = "read a value through campfire_codec::JsonValue" },
    # Banned everywhere: randomly seeded, so iteration order differs between runs, which breaks determinism.
    { path = "std::collections::HashMap", reason = "randomly seeded; use a fixed-hasher map" },
    { path = "std::collections::HashSet", reason = "randomly seeded; use a fixed-hasher set" },
    { path = "std::hash::RandomState", reason = "randomly seeded" },
]

