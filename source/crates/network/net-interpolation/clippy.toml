    { path = "std::fs::write", reason = "touch files through campfire-store" },
    { path = "std::fs::copy", reason = "touch files through campfire-store" },
    { path = "std::fs::rename", reason = "touch files through campfire-store" },
    { path = "std::fs::hard_link", reason = "touch files through campfire-store" },
