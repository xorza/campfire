    { path = "bevy_ecs::world::World::despawn", reason = "despawn through campfire_net_despawns::DespawnReplicated" },
    { path = "bevy_ecs::world::World::despawn_all", reason = "despawn through campfire_net_despawns::DespawnReplicated" },
