license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
# `Reflect` on the shared types, for the ECS crates that hold them in components and resources
reflect = ["dep:bevy_reflect"]

[dependencies]
campfire-common.workspace = true
campfire-math.workspace = true
campfire-net-bytes.workspace = true

getrandom.workspace = true
serde.workspace = true

bevy_platform = { workspace = true, features = ["std"] }
bevy_reflect = { workspace = true, features = ["std", "smallvec"], optional = true }

[lints]
workspace = true
