[package]
name = "campfire-net-emulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
# The model's bench, for the benches of every layer above
internals = ["dep:campfire-measure", "dep:criterion", "campfire-math/internals"]

[dependencies]
campfire-net-core.workspace = true
campfire-math.workspace = true

bytes = { workspace = true, features = ["std"] }
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }

bevy_platform = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-net-emulator = { workspace = true, features = ["internals"] }


[[bench]]
name = "net-emulator"
harness = false
required-features = ["internals"]

[lints]
workspace = true
