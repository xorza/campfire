[package]
name = "campfire-net-messages"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "dep:campfire-measure",
    "campfire-codec/internals",
    "dep:criterion",
    "dep:campfire-net-stepper",
    "campfire-net-transport/internals",
    "campfire-net-channels/internals",
    "campfire-net-bytes/internals",
    "campfire-net-payload/internals",
    "dep:campfire-math",
    "campfire-math/internals",
]

[dependencies]
campfire-math = { workspace = true, optional = true }
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-net-channels.workspace = true
campfire-net-bytes.workspace = true
campfire-net-core.workspace = true
campfire-net-link.workspace = true
campfire-net-connection.workspace = true
campfire-net-stepper = { workspace = true, optional = true }
campfire-net-transport.workspace = true
campfire-net-payload.workspace = true

bytes = { workspace = true, features = ["std"] }
campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }

bevy_app.workspace = true
bevy_derive.workspace = true
bevy_ecs = { workspace = true, features = ["serialize", "std"] }
bevy_reflect = { workspace = true, features = ["smallvec", "std"] }
bevy_replicon = { workspace = true, features = ["client", "server"] }
bevy_utils = { workspace = true, features = ["debug"] }

[dev-dependencies]
campfire-net-messages = { workspace = true, features = ["internals"] }
campfire-net-timeline = { workspace = true, features = ["internals"] }


[[bench]]
name = "net-messages"
harness = false
required-features = ["internals"]

[lints]
workspace = true
