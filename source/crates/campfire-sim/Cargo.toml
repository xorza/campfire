[package]
name = "campfire-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
internals = []
bench = ["internals", "dep:criterion"]

[dependencies]
campfire-common.workspace = true
campfire-math.workspace = true

bevy_ecs.workspace = true
blake3.workspace = true
criterion = { workspace = true, optional = true }
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }

[[test]]
name = "tests"
path = "tests/mod.rs"

# Criterion's target holds the benches, so `cargo bench -- <criterion flags>` reaches only it.
[lib]
bench = false

[[bench]]
name = "sim"
harness = false
required-features = ["bench"]

[lints]
workspace = true
