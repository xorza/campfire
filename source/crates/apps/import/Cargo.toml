[package]
name = "campfire-import"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "app"

[features]
internals = [
    "campfire-actions/internals",
    "campfire-client-files/internals",
    "campfire-codec/internals",
    "campfire-combat/internals",
    "campfire-declarations/internals",
    "campfire-geometry/internals",
    "campfire-log/internals",
    "campfire-math/internals",
    "campfire-mode/internals",
    "campfire-navigation/internals",
    "campfire-package/internals",
    "campfire-package-disk/internals",
    "campfire-production/internals",
    "campfire-projectiles/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-stats/internals",
    "campfire-store/internals",
    "campfire-units/internals",
    "campfire-values/internals",
]

[dependencies]
campfire-actions.workspace = true
campfire-client-files.workspace = true
campfire-codec.workspace = true
campfire-combat.workspace = true
campfire-common.workspace = true
campfire-declarations.workspace = true
campfire-log = { workspace = true, features = ["start"] }
campfire-math.workspace = true
campfire-geometry.workspace = true
campfire-mode.workspace = true
campfire-navigation.workspace = true
campfire-package.workspace = true
campfire-package-disk.workspace = true
campfire-production.workspace = true
campfire-projectiles.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-stats.workspace = true
campfire-store.workspace = true
campfire-units.workspace = true
campfire-values.workspace = true

bevy_math = { workspace = true, features = ["serialize", "std"] }
clap = { workspace = true, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
derive_more = { workspace = true, features = ["display"] }
gltf-json = { workspace = true, features = [
    "KHR_materials_specular",
    "KHR_materials_unlit",
    "extensions",
    "names",
] }
miniz_oxide = { workspace = true, features = ["with-alloc"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
campfire-import = { workspace = true, features = ["internals"] }

fluent-syntax.workspace = true

[lints]
workspace = true
