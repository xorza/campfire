[package]
name = "campfire-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "app"

[features]
internals = [
    "campfire-actions/internals",
    "campfire-areas/internals",
    "campfire-bots/internals",
    "campfire-capabilities/internals",
    "campfire-client-files/internals",
    "campfire-codec/internals",
    "campfire-combat/internals",
    "campfire-declarations/internals",
    "campfire-geometry/internals",
    "campfire-host/internals",
    "campfire-interaction/internals",
    "campfire-items/internals",
    "campfire-logging/internals",
    "campfire-math/internals",
    "campfire-mode/internals",
    "campfire-net/internals",
    "campfire-net-endpoint/internals",
    "campfire-net-socket/internals",
    "campfire-orders/internals",
    "campfire-package/internals",
    "campfire-package-disk/internals",
    "campfire-package-format/internals",
    "campfire-players/internals",
    "campfire-protocol/internals",
    "campfire-production/internals",
    "campfire-progression/internals",
    "campfire-projectiles/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-stats/internals",
    "campfire-store/internals",
    "campfire-units/internals",
    "campfire-values/internals",
    "campfire-vision/internals",
    "dep:campfire-measure",
    "dep:criterion",
]

[dependencies]
campfire-app-threads.workspace = true
campfire-actions.workspace = true
campfire-areas.workspace = true
campfire-bots.workspace = true
campfire-capabilities.workspace = true
campfire-client-files.workspace = true
campfire-codec.workspace = true
campfire-combat.workspace = true
campfire-common.workspace = true
campfire-declarations.workspace = true
campfire-geometry.workspace = true
campfire-host.workspace = true
campfire-interaction.workspace = true
campfire-items.workspace = true
campfire-logging.workspace = true
campfire-math.workspace = true
campfire-mode.workspace = true
campfire-net = { workspace = true, features = ["udp"] }
campfire-net-connection.workspace = true
campfire-net-core.workspace = true
campfire-net-endpoint.workspace = true
campfire-net-socket.workspace = true
campfire-orders.workspace = true
campfire-package.workspace = true
campfire-package-disk.workspace = true
campfire-package-format.workspace = true
campfire-players.workspace = true
campfire-protocol.workspace = true
campfire-production.workspace = true
campfire-progression.workspace = true
campfire-projectiles.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-stats.workspace = true
campfire-store.workspace = true
campfire-units.workspace = true
campfire-values = { workspace = true, features = ["ecs"] }
campfire-vision.workspace = true

campfire-measure = { workspace = true, optional = true }
criterion = { workspace = true, features = ["cargo_bench_support"], optional = true }

async-lock = { workspace = true, features = ["std"] }
bevy = { workspace = true, features = [
    "async_executor",
    "bevy_animation",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "gltf_animation",
    "ktx2",
    "multi_threaded",
    # A world asset, as a model's glTF scene, spawns its components by reflection, which needs each
    # type registered, and Bevy's own plugins register theirs only through it.
    "reflect_auto_register",
    "std",
    "ui_picking",
    "wayland",
    "x11",
] }
clap = { workspace = true, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
fluent-bundle.workspace = true
secp256k1 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }
unic-langid.workspace = true

[dev-dependencies]
campfire-client = { workspace = true, features = ["internals"] }
campfire-test-packages.workspace = true
fluent-syntax.workspace = true
naga = { workspace = true, features = ["wgsl-in"] }

[lints]
workspace = true


[[bench]]
name = "client"
harness = false
required-features = ["internals"]
