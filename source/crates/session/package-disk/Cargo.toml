[package]
name = "campfire-package-disk"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "campfire-package/internals",
    "campfire-store/internals",
    "campfire-values/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-package.workspace = true
campfire-store.workspace = true
campfire-values.workspace = true

thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-package-disk = { workspace = true, features = ["internals"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }

[lints]
workspace = true
