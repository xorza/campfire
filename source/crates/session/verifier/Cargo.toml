[package]
name = "campfire-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[package.metadata.campfire]
kind = "app"

[features]
internals = [
    "campfire-log/internals",
    "campfire-package/internals",
    "campfire-package-disk/internals",
    "campfire-protocol/internals",
    "campfire-runner/internals",
    "campfire-sim/internals",
    "campfire-store/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-log = { workspace = true, features = ["start"] }
campfire-package.workspace = true
campfire-package-disk.workspace = true
campfire-protocol.workspace = true
campfire-runner.workspace = true
campfire-sim.workspace = true
campfire-store.workspace = true

clap.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
campfire-verifier = { workspace = true, features = ["internals"] }

[lints]
workspace = true

[[test]]
name = "tests"
path = "tests/mod.rs"
