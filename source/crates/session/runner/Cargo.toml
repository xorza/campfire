[package]
name = "campfire-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "dep:campfire-actions",
    "campfire-actions/internals",
    "campfire-capabilities/internals",
    "campfire-declarations/internals",
    "campfire-log/internals",
    "dep:campfire-math",
    "campfire-math/internals",
    "campfire-mode/internals",
    "campfire-package/internals",
    "campfire-players/internals",
    "campfire-protocol/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "dep:campfire-stats",
    "campfire-stats/internals",
    "dep:campfire-units",
    "campfire-units/internals",
    "dep:campfire-values",
    "campfire-values/internals",
    "dep:campfire-vision",
    "campfire-vision/internals",
]

[dependencies]
campfire-actions = { workspace = true, optional = true }
campfire-capabilities.workspace = true
campfire-common.workspace = true
campfire-declarations.workspace = true
campfire-log.workspace = true
campfire-mode.workspace = true
campfire-package.workspace = true
campfire-players.workspace = true
campfire-protocol.workspace = true
campfire-script.workspace = true
campfire-math = { workspace = true, optional = true }
campfire-sim.workspace = true
campfire-stats = { workspace = true, optional = true }
campfire-units = { workspace = true, optional = true }
campfire-values = { workspace = true, optional = true }
campfire-visibility.workspace = true
campfire-vision = { workspace = true, optional = true }

bevy_ecs = { workspace = true, features = ["std"] }
secp256k1 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
campfire-areas = { workspace = true, features = ["internals"] }
campfire-combat = { workspace = true, features = ["internals"] }
campfire-deliveries = { workspace = true, features = ["internals"] }
campfire-navigation = { workspace = true, features = ["internals"] }
campfire-orders = { workspace = true, features = ["internals"] }
campfire-package-format = { workspace = true, features = ["internals"] }
campfire-projectiles = { workspace = true, features = ["internals"] }
campfire-runner = { workspace = true, features = ["internals"] }
# Its tests read the workspace's test packages from disk.
campfire-test-packages.workspace = true

[lints]
workspace = true
