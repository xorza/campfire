[package]
name = "campfire-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = [
    "campfire-capabilities/internals",
    "campfire-common/internals",
    "campfire-declare/internals",
    "campfire-log/internals",
    "campfire-mode/internals",
    "campfire-package/internals",
    "campfire-package-disk/internals",
    "campfire-players/internals",
    "campfire-protocol/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-units/internals",
    "campfire-visibility/internals",
    "campfire-vision/internals",
]

[dependencies]
campfire-capabilities.workspace = true
campfire-common.workspace = true
campfire-declare.workspace = true
campfire-log.workspace = true
campfire-mode.workspace = true
campfire-package.workspace = true
# Its tests read the workspace's test packages from disk.
campfire-package-disk = { workspace = true, optional = true }
campfire-players.workspace = true
campfire-protocol.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-units.workspace = true
campfire-visibility.workspace = true
campfire-vision = { workspace = true, optional = true }

bevy_ecs.workspace = true
secp256k1.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
campfire-runner = { workspace = true, features = ["internals"] }

[lints]
workspace = true
