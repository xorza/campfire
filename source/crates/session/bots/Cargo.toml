[package]
name = "campfire-bots"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "glue"

[features]
internals = [
    "campfire-actions/internals",
    "campfire-capabilities/internals",
    "campfire-codec/internals",
    "campfire-geometry/internals",
    "campfire-items/internals",
    "campfire-math/internals",
    "campfire-mode/internals",
    "campfire-players/internals",
    "campfire-script/internals",
    "campfire-sim/internals",
    "campfire-store/internals",
    "campfire-units/internals",
    "campfire-values/internals",
    "campfire-vision/internals",
]

[dependencies]
campfire-actions.workspace = true
campfire-capabilities.workspace = true
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-geometry.workspace = true
campfire-items.workspace = true
campfire-math.workspace = true
campfire-mode.workspace = true
campfire-players.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true
campfire-store.workspace = true
campfire-units.workspace = true
campfire-values.workspace = true
campfire-vision.workspace = true

bevy_ecs = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-bots = { workspace = true, features = ["internals"] }
campfire-orders = { workspace = true, features = ["internals"] }
campfire-progression = { workspace = true, features = ["internals"] }
# Its tests resolve scripts in the workspace's test packages.
campfire-test-packages.workspace = true

[lints]
workspace = true
