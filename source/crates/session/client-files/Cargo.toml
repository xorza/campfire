[package]
name = "campfire-client-files"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
internals = [
    "campfire-math/internals",
    "campfire-values/internals",
]

[dependencies]
campfire-common.workspace = true
campfire-math.workspace = true
campfire-values.workspace = true

bevy_math = { workspace = true, features = ["serialize", "std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
campfire-client-files = { workspace = true, features = ["internals"] }
campfire-codec = { workspace = true, features = ["internals"] }

[lints]
workspace = true
