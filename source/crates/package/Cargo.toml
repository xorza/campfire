[package]
name = "campfire-package"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
internals = []

[dependencies]
campfire-capabilities.workspace = true
campfire-content.workspace = true
campfire-math.workspace = true
campfire-script.workspace = true
campfire-sim.workspace = true

fluent-bundle.workspace = true
fluent-syntax.workspace = true
postcard.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
unic-langid.workspace = true

# The integration tests find the reference packages through `internals`.
[dev-dependencies]
campfire-package = { workspace = true, features = ["internals"] }
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "tests"
path = "tests/mod.rs"
