[package]
name = "campfire-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[dependencies]
campfire-common-derive.workspace = true
blake3 = { workspace = true, features = ["std"] }
