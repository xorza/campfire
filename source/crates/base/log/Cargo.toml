[package]
name = "campfire-log"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = [
    "campfire-codec/internals",
    "campfire-common?/internals",
    "campfire-store?/internals",
    "dep:tracing-subscriber",
]
# The binaries' start: the terminal and the JSON file, which a worker of `store` writes. Only a
# binary turns it on, so no crate of the deterministic core depends on `store`.
start = ["dep:campfire-common", "dep:campfire-store", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
campfire-codec.workspace = true
campfire-common = { workspace = true, optional = true }
campfire-store = { workspace = true, optional = true }

clap = { workspace = true, optional = true }
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }

[lints]
workspace = true
