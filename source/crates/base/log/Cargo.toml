[package]
name = "campfire-log"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
internals = ["campfire-codec/internals", "dep:campfire-common"]

[dependencies]
campfire-codec.workspace = true
campfire-common = { workspace = true, optional = true }

serde = { workspace = true, features = ["derive", "rc", "std"] }
tracing = { workspace = true, features = ["attributes", "std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "registry", "std"] }

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }
campfire-threads = { workspace = true, features = ["internals"] }

[lints]
workspace = true
