[package]
name = "campfire-log"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "problem"

[features]
internals = [
    "campfire-codec/internals",
    "campfire-store?/internals",
    "dep:tracing-subscriber",
]
# The binaries' start: the terminal and the JSON file, which a worker of `store` writes. Only a
# binary turns it on, so no crate of the deterministic core depends on `store`.
start = ["dep:campfire-store", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-store = { workspace = true, optional = true }

clap = { workspace = true, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
], optional = true }
serde = { workspace = true, features = ["derive", "rc", "std"] }
tracing = { workspace = true, features = ["attributes", "std"] }
tracing-subscriber = { workspace = true, features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "std",
    "tracing-log",
], optional = true }

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }
campfire-store = { workspace = true, features = ["internals"] }

[lints]
workspace = true
