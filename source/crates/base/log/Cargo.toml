[package]
name = "campfire-log"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
internals = [
    "campfire-common/internals",
    "campfire-store?/internals",
]
# The binaries' start: the terminal and the JSON file, which a worker of `store` writes. Only a
# binary turns it on, so no crate of the deterministic core depends on `store`.
start = ["dep:campfire-store"]

[dependencies]
campfire-codec.workspace = true
campfire-common.workspace = true
campfire-store = { workspace = true, optional = true }

clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
campfire-log = { workspace = true, features = ["internals"] }
campfire-store = { workspace = true, features = ["internals"] }

[lints]
workspace = true
