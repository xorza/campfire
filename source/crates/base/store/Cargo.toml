[package]
name = "campfire-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.campfire]
kind = "proxy"

[features]
internals = [
    "dep:tempfile",
    "campfire-platform/internals",
    "campfire-threads/internals",
]

[dependencies]
campfire-platform.workspace = true
campfire-threads.workspace = true

tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
campfire-store = { workspace = true, features = ["internals"] }

[lints]
workspace = true
