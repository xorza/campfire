[package]
name = "campfire-net"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
internals = ["dep:bevy_state", "dep:bevy_time"]
bench = ["internals", "dep:criterion"]

[dependencies]
campfire-capabilities.workspace = true
campfire-math.workspace = true
campfire-package.workspace = true
campfire-protocol.workspace = true
campfire-runner.workspace = true
campfire-sim.workspace = true

bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_state = { workspace = true, optional = true }
bevy_time = { workspace = true, optional = true }
criterion = { workspace = true, optional = true }
lightyear.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true

[[test]]
name = "tests"
path = "tests/mod.rs"
required-features = ["internals"]

[[bench]]
name = "rollback"
harness = false
required-features = ["bench"]

[lints]
workspace = true
