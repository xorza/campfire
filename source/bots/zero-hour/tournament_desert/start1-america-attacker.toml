# The attacker of America at Tournament Desert's start 1, `Player_1_Start`. It starts standard, with
# its command center and dozer, and the money of a skirmish's 50,000: its dozer builds a power
# plant, a barracks, a supply center and a war factory round its command center, at the places the
# Zero Hour check's skirmish play builds them; then, every 60 s from 2 minutes on, its barracks
# trains a ranger and its war factory a crusader, and its rangers, missile defenders, crusaders and
# humvees move to start 2, (1011, -2103), and attack the nearest enemy they see 20 s later. Each
# slot is the train or the build its unit type's action of that name holds. Play it with
# `--server-bot 0=<this file> --pick 0:faction=america --option start_money=50000`, against the
# builder.

# The dozer's builds, at America's angle of -135 degrees.
[[order]]
tick = 1
units = "americavehicledozer"
directive.orders.build = { slot = "build_americapowerplant", target.point = { at = [855, -584], angle = -135 } }

[[order]]
tick = 600
units = "americavehicledozer"
directive.orders.build = { slot = "build_americabarracks", target.point = { at = [1005, -800], angle = -135 } }

[[order]]
tick = 1200
units = "americavehicledozer"
directive.orders.build = { slot = "build_americasupplycenter", target.point = { at = [1155, -584], angle = -135 } }

