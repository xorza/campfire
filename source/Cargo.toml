# The driver's lanes and the workspace's own commands, which `cargo drive` runs; `version` names
# the driver the workspace needs, and a driver it does not name refuses to run.
[workspace.metadata.drive]
version = "0.2.5"
# Every bench built, so a bench that no longer builds fails the gate (02-engine-core.md, The gate
# builds every bench).
gate-benches = true
# Windows from Linux in a local gate, as CI lints Windows on Windows.
cross-lint = { linux = ["x86_64-pc-windows-gnu"] }
# The binaries a release ships (02-engine-core.md, A release keeps its debug info beside its
# binaries).
package = ["campfire-client", "campfire-server", "campfire-verifier", "campfire-import"]
reads = [
    # The workspace's rules read every crate's files, the design documents, and AGENTS.md's titles.
    { member = "campfire-rules", paths = [".", "../docs/design", "../AGENTS.md"] },
    # The script API's reference and the overview's decisions.
    { member = "campfire-capabilities", paths = ["../docs/design"] },
]

# The one test that compares each workspace package with its `package.index` writes the index
# again from the package's files, before the tests that load the packages: `package-disk` alone
# reads the packages' directories, by the format `package` holds.
[workspace.metadata.drive.commands.index]
joins = "test"
steps = [{ tests = "package(=campfire-package-disk) & test(=package_dir::tests::every_workspace_package_holds_the_index_of_its_files)", env = { CAMPFIRE_BLESS = "1" } }]

# The one test that compares the script API's reference with what the registry writes writes it
# again, so a change to the API comes with its reference (06-script-api.md, One source).
[workspace.metadata.drive.commands.reference]
joins = "test"
steps = [{ tests = "package(=campfire-capabilities) & binary(=tests) & test(=scripts::script_api::the_reference_is_what_the_registry_writes)", env = { CAMPFIRE_BLESS = "1" } }]

# The LAN check, with the processes it starts built beside it as they ship, in one build of the
# four in the dev profile, on the units the tests built where their features agree
# (02-engine-core.md, The LAN check builds in the dev profile).
[workspace.metadata.drive.commands.lan]
joins = "gate"
steps = [
    { build = "build --bins -p campfire-lan-check -p campfire-server -p campfire-client -p campfire-verifier" },
    { program = ["{target}/debug/campfire-lan-check{exe}", "{target}/drive/lan-check"] },
]

# The Zero Hour check, which needs `GENERALSZH_DATA`: its arguments are the check's own; its
# plays run the crates' asserts. A failure shows its errors, a panic and the build's, not the
# check's first lines, which report the import.
[workspace.metadata.drive.commands.zero-hour]
errors = ["ERROR", "panicked at", "error["]
steps = [{ cargo = "run --profile checks -p campfire-zero-hour-check", args = true }]

# The client and the dedicated server, to play: each builds in `release-dev`, runs with its
# arguments.
[workspace.metadata.drive.commands.client]
steps = [{ cargo = "run --profile release-dev -p campfire-client", args = true }]

[workspace.metadata.drive.commands.server]
steps = [{ cargo = "run --profile release-dev -p campfire-server", args = true }]

