[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "off"
overflow-checks = true

[profile.bench]
debug = "line-tables-only"
strip = "none"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

