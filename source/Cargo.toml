[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Exact versions: a release must rebuild bit for bit (design/02-engine-core.md).
[workspace.dependencies]
bevy_app = "=0.19.1"
bevy_ecs = { version = "=0.19.1", features = ["debug"] }
bevy_state = "=0.19.1"
bevy_time = "=0.19.1"
blake3 = "=1.8.7"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
lightyear = { version = "=0.30.1", features = ["webtransport", "crossbeam", "raw_connection"] }
nostr = "=0.45.5"
postcard = { version = "=1.1.3", features = ["use-std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# No default features: they reseed Rhai's hasher in every process. `script` also sets a
# fixed seed, because Rhai always seeds per build otherwise. `internals` gives `AST::walk`
# for the package load checks; its API is unstable, which the exact pin makes safe.
rhai = { version = "=1.26.1", default-features = false, features = ["std", "no_float", "no_time", "internals"] }
secp256k1 = "=0.30.0"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.0"
toml = "=1.1.6"

campfire-capabilities = { path = "crates/capabilities" }
campfire-content = { path = "crates/content" }
campfire-identity = { path = "crates/identity" }
campfire-math = { path = "crates/math" }
campfire-net = { path = "crates/net" }
campfire-package = { path = "crates/package" }
campfire-protocol = { path = "crates/protocol" }
campfire-runner = { path = "crates/runner" }
campfire-script = { path = "crates/script" }
campfire-sim = { path = "crates/sim" }
campfire-verifier = { path = "crates/verifier" }

# Warn, not deny: the check chain runs clippy with `-D warnings`, and builds keep working mid-edit.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
# Deny, not forbid: Bevy derives emit unsafe impls under a local allow.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
absolute_paths = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
self_named_module_files = "warn"
todo = "warn"
unused_result_ok = "warn"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
overflow-checks = true

[profile.release-max]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.bench]
inherits = "release-max"
debug = "line-tables-only"
strip = "none"
incremental = true
