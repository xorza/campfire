[workspace]
resolver = "3"
members = ["crates/*", "checks/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"


# Exact versions: a release must rebuild bit for bit (docs/design/02-engine-core.md).
[workspace.dependencies]
campfire-capabilities = { path = "crates/campfire-capabilities" }
campfire-common = { path = "crates/campfire-common" }
campfire-import = { path = "crates/campfire-import" }
campfire-log = { path = "crates/campfire-log" }
campfire-math = { path = "crates/campfire-math" }
campfire-net = { path = "crates/campfire-net" }
campfire-package = { path = "crates/campfire-package" }
campfire-protocol = { path = "crates/campfire-protocol" }
campfire-runner = { path = "crates/campfire-runner" }
campfire-script = { path = "crates/campfire-script" }
campfire-sim = { path = "crates/campfire-sim" }
campfire-store = { path = "crates/campfire-store" }
campfire-verifier = { path = "crates/campfire-verifier" }

arrayvec = { version = "=0.7.8", default-features = false }
bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_color",
    "bevy_gltf",
    "ktx2",
    "png",
    # A glTF's scene spawns by reflection, so every type it holds must be registered.
    "reflect_auto_register",
] }
bevy_app = "=0.19.1"
# The version Lightyear builds, for the component-scope visibility filter that Lightyear uses but
# does not re-export: the pin follows Lightyear's at each upgrade.
bevy_replicon = { version = "=0.44.2", default-features = false, features = ["server"] }
bevy_ecs = { version = "=0.19.1", features = ["debug"] }
bevy_state = "=0.19.1"
bevy_time = "=0.19.1"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
derive_more = { version = "=2.1.1", default-features = false, features = ["display"] }
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
getrandom = "=0.3.4"
# Only `store`'s platform layer, on Unix: the process's effective user, which std does not give.
libc = "=0.2.190"
lightyear = { version = "=0.30.1", features = ["webtransport", "crossbeam", "raw_connection"] }
# The version Lightyear builds, for the types of its message registration with our own encode and
# decode, which Lightyear does not re-export: the pin follows Lightyear's at each upgrade.
lightyear_serde = "=0.30.1"
miniz_oxide = "=0.9.1"
nostr = "=0.45.5"
postcard = { version = "=1.1.3", features = ["use-std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# No default features: they reseed Rhai's hasher in every process. `script` also sets a
# fixed seed, because Rhai always seeds per build otherwise. `internals` gives `AST::walk`
# for the package load checks; its API is unstable, which the exact pin makes safe.
rhai = { version = "=1.26.1", default-features = false, features = ["std", "no_float", "no_time", "internals"] }
secp256k1 = "=0.30.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
    "json",
    "tracing-log",
] }
unic-langid = "=0.9.6"
# Only `store`'s platform layer, on Windows: its ACL, rename and directory-flush calls.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
wtransport = "=0.6.1"
zeroize = "=1.9.0"

[profile.dev]
overflow-checks = true
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
split-debuginfo = "packed"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "off"
strip = "none"

# Warn, not deny: the check chain runs clippy with `-D warnings`, and builds keep working mid-edit.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
absolute_paths = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
self_named_module_files = "warn"
todo = "warn"
unused_result_ok = "warn"
