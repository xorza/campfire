# Opt-level 1, not 0, keeps the debug build's scripted matches and sweeps inside their time
# bounds (02-engine-core.md, The workspace's own code builds at opt-level 1).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "off"
# A plain integer that wraps in a shipped sim panics, as it does in a test, and does not desync
# (02-engine-core.md, A release checks overflow).
overflow-checks = true

[profile.bench]
debug = "line-tables-only"
strip = "none"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

# The Zero Hour check's build (02-engine-core.md, The Zero Hour check runs the asserts).
[profile.checks]
inherits = "release-dev"
debug-assertions = true
lto = false

