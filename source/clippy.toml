# Randomly seeded: iteration order differs between runs, which breaks determinism.
disallowed-types = [
    # What holds a file is banned by its type, so each of its methods is, a new one included (design 02, Storage).
    { path = "std::fs::File", reason = "touch files through campfire-store" },
    { path = "std::fs::OpenOptions", reason = "touch files through campfire-store" },
    { path = "std::fs::DirBuilder", reason = "touch files through campfire-store" },
    { path = "std::fs::ReadDir", reason = "touch files through campfire-store" },
    { path = "std::fs::DirEntry", reason = "touch files through campfire-store" },
    { path = "std::fs::Metadata", reason = "touch files through campfire-store" },
    { path = "tempfile::TempDir", reason = "a test's files live in campfire_store::Scratch" },
    { path = "tempfile::NamedTempFile", reason = "a test's files live in campfire_store::Scratch" },
    { path = "std::collections::HashMap", reason = "randomly seeded; use a fixed-hasher map" },
    { path = "std::collections::HashSet", reason = "randomly seeded; use a fixed-hasher set" },
    { path = "std::hash::RandomState", reason = "randomly seeded" },
    # Only `common`'s `codec` calls the formats (design 02, Serialization): one configuration, one canonical form and one error type for each.
    { path = "postcard::Serializer", reason = "encode through campfire_common::Binary" },
    { path = "postcard::Deserializer", reason = "decode through campfire_common::Binary" },
    { path = "toml::Serializer", reason = "write through campfire_common::Toml" },
    { path = "toml::Deserializer", reason = "parse through campfire_common::Toml" },
    { path = "serde_json::Serializer", reason = "write through campfire_common::Json" },
    { path = "serde_json::Deserializer", reason = "parse through campfire_common::Json" },
]

