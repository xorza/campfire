# Randomly seeded: iteration order differs between runs, which breaks determinism.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "randomly seeded; use a fixed-hasher map" },
    { path = "std::collections::HashSet", reason = "randomly seeded; use a fixed-hasher set" },
    { path = "std::hash::RandomState", reason = "randomly seeded" },
]

# Each one lets two conflicting sim systems run in either order, which the sim schedule refuses.
disallowed-methods = [
    { path = "bevy_ecs::schedule::IntoScheduleConfigs::ambiguous_with", reason = "order the systems instead" },
    { path = "bevy_ecs::schedule::IntoScheduleConfigs::ambiguous_with_all", reason = "order the systems instead" },
    { path = "bevy_ecs::schedule::Schedule::ignore_ambiguity", reason = "order the systems instead" },
    { path = "bevy_ecs::schedule::Schedule::set_build_settings", reason = "can switch off the ambiguity and hierarchy checks" },
    { path = "bevy_ecs::schedule::Schedules::ignore_ambiguity", reason = "order the systems instead" },
    { path = "bevy_ecs::schedule::Schedules::allow_ambiguous_component", reason = "order the systems instead" },
    { path = "bevy_ecs::schedule::Schedules::allow_ambiguous_resource", reason = "order the systems instead" },
    { path = "bevy_ecs::schedule::Schedules::configure_schedules", reason = "can switch off the ambiguity and hierarchy checks" },
    { path = "bevy_ecs::world::World::allow_ambiguous_component", reason = "order the systems instead" },
    { path = "bevy_ecs::world::World::allow_ambiguous_resource", reason = "order the systems instead" },
    # Only `store` writes a file (design 02, Storage): a write elsewhere skips its durability and its one fault surface.
    { path = "std::fs::write", reason = "write files through campfire-store" },
    { path = "std::fs::copy", reason = "write files through campfire-store" },
    { path = "std::fs::rename", reason = "write files through campfire-store" },
    { path = "std::fs::hard_link", reason = "write files through campfire-store" },
    { path = "std::fs::remove_file", reason = "write files through campfire-store" },
    { path = "std::fs::remove_dir", reason = "write files through campfire-store" },
    { path = "std::fs::remove_dir_all", reason = "write files through campfire-store" },
    { path = "std::fs::create_dir", reason = "write files through campfire-store" },
    { path = "std::fs::create_dir_all", reason = "write files through campfire-store" },
    { path = "std::fs::set_permissions", reason = "write files through campfire-store" },
    { path = "std::fs::DirBuilder::new", reason = "write files through campfire-store" },
    { path = "std::fs::File::create", reason = "write files through campfire-store" },
    { path = "std::fs::File::create_new", reason = "write files through campfire-store" },
    { path = "std::fs::File::options", reason = "write files through campfire-store" },
    { path = "std::fs::File::set_len", reason = "write files through campfire-store" },
    { path = "std::fs::File::sync_all", reason = "write files through campfire-store" },
    { path = "std::fs::File::sync_data", reason = "write files through campfire-store" },
    { path = "std::fs::File::set_permissions", reason = "write files through campfire-store" },
    { path = "std::fs::OpenOptions::new", reason = "write files through campfire-store" },
    # Every thread starts through store's Worker (design 02, Storage): it names the thread, closes and joins it, and does not hang a crash.
    { path = "std::thread::spawn", reason = "start threads through campfire_store::Worker" },
    { path = "std::thread::scope", reason = "start threads through campfire_store::Worker" },
    { path = "std::thread::Builder::spawn", reason = "start threads through campfire_store::Worker" },
    { path = "std::thread::Builder::spawn_scoped", reason = "start threads through campfire_store::Worker" },
]
