name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request ends its older run; every run of a branch runs to its end, so
# each of its commits gets a verdict and master's saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  # The driver's gate, a LAN match among its steps, on each platform. Each keeps its match's run
  # directory, with the session log, for the platforms to verify one another's, and the verifier
  # that verifies them on its platform.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The driver, `cargo-drive`, at the commit of the release the drive table's `version` names;
      # one the cache brought back at that commit stays.
      - name: Install the driver
        run: cargo install --locked --git https://github.com/xorza/drive --rev dcb1db7afe89a955f2d7d6c7e3aeafc6d7a0a477 cargo-drive
      # Nextest runs each test in its own process, and ends one that runs past its bound in
      # source/.config/nextest.toml: libtest can end no test.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.148
      # Every check CI runs is a step of the gate, the list a local `cargo drive gate` runs too;
      # nextest's `ci` profile gives a slower runner's tests their longer bound.
      - name: Gate
        run: cargo drive gate --ci
        env:
          NEXTEST_PROFILE: ci
      # What a failed gate leaves: each failed step's log, all the gate printed, and each test's
      # outcome and time.
      - name: Keep the failed gate's logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ runner.os }}
          path: |
            source/target/drive/log
            source/target/drive/last-gate.txt
            source/target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the LAN match
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lan-check-${{ runner.os }}
          path: source/target/drive/lan-check
          retention-days: 7
          if-no-files-found: ignore
      # The gate's LAN build writes the check and the verifier in target/debug, in its one build of
      # the four processes. A tar keeps the executable bits, which an artifact drops.
      # Its paths stay relative: GNU tar reads the `D:` of a Windows path as a remote host. A gate
      # that failed before its LAN build leaves none, and the other platforms verify without it.
      - name: Pack the verifier
        if: ${{ !cancelled() }}
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          bin=target/debug
          if [ ! -f "$bin/campfire-lan-check$exe" ] || [ ! -f "$bin/campfire-verifier$exe" ]; then
            echo "::warning::the gate built no verifier on $RUNNER_OS"
            exit 0
          fi
          tar -cf target/verifier.tar -C "$bin" "campfire-lan-check$exe" "campfire-verifier$exe"
      - name: Keep the verifier
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-${{ runner.os }}
          path: source/target/verifier.tar
          retention-days: 7
          if-no-files-found: ignore

  # Every platform's verifier replays every platform's session log to that server's final hash. It
  # runs the binaries its platform's check built, so it builds nothing; the checkout holds the
  # packages, at the path the check was built in. It runs whatever the checks came to, so one
  # platform's failure does not hide the others' verification: a platform whose check left no
  # match or no verifier is skipped with a warning, and its failed check keeps the run red.
  cross-verify:
    name: cross-verify (${{ matrix.os }})
    needs: check
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pattern that matches no artifact downloads none and does not fail, as a name would.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verifier-${{ runner.os }}
          path: verifier
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lan-check-*
          path: ${{ runner.temp }}/runs
      - name: Verify each platform's match
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          bin=../verifier
          if [ ! -f "$bin/verifier.tar" ]; then
            echo "::warning::the check on $RUNNER_OS kept no verifier"
            exit 0
          fi
          tar -xf "$bin/verifier.tar" -C "$bin"
          # Each artifact holds the run root of one check, with its one run's directory. A run that
          # fails to verify fails the step after the others verified.
          failed=0
          for os in Linux Windows macOS; do
            runs="$RUNNER_TEMP/runs/lan-check-$os"
            if [ ! -d "$runs" ]; then
              echo "::warning::the check on $os kept no match"
              continue
            fi
            echo "::group::the match played on $os"
            for run in "$runs"/*/; do
              "$bin/campfire-lan-check$exe" verify --verifier "$bin/campfire-verifier$exe" "$run" || failed=1
            done
            echo "::endgroup::"
          done
          exit "$failed"
