name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  # The check chain and a LAN match on each platform. Each keeps its match's run directory, with
  # the session log, for the platforms to verify one another's.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --tests --all-features --locked
      - name: LAN check
        run: cargo run --locked -p campfire-lan-check -- "$RUNNER_TEMP/lan-check"
      - name: Keep the LAN match
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lan-check-${{ runner.os }}
          path: ${{ runner.temp }}/lan-check
          retention-days: 7
          if-no-files-found: ignore

  # Every platform's verifier replays every platform's session log to that server's final hash.
  cross-verify:
    name: cross-verify (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lan-check-*
          path: ${{ runner.temp }}/runs
      - name: Verify each platform's match
        run: |
          # Each artifact holds the run root of one check, with its one run's directory.
          for os in Linux Windows macOS; do
            echo "::group::the match played on $os"
            for run in "$RUNNER_TEMP/runs/lan-check-$os"/*/; do
              cargo run --locked -p campfire-lan-check -- verify "$run"
            done
            echo "::endgroup::"
          done
