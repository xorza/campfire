name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  # The check chain and a LAN match on each platform. Each keeps its match's run directory, with
  # the session log, for the platforms to verify one another's, and the verifier that verifies them
  # on its platform.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --tests --all-features --locked
      - name: Benches
        run: cargo test --workspace --all-features --locked --bench '*'
      # One build for the check and the processes it starts, which then share every feature: alone,
      # `cargo run -p campfire-lan-check` selects other features and compiles the workspace again.
      # The check builds the processes with the cargo `CARGO` names, as `cargo run` sets it, and
      # finds every crate fresh.
      - name: LAN check
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cargo build --locked -p campfire-lan-check -p campfire-server -p campfire-client -p campfire-verifier
          CARGO=cargo "target/debug/campfire-lan-check$exe" "$RUNNER_TEMP/lan-check"
      - name: Keep the LAN match
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lan-check-${{ runner.os }}
          path: ${{ runner.temp }}/lan-check
          retention-days: 7
          if-no-files-found: ignore
      # The LAN check's build writes the check and the verifier in target/debug last, after the
      # tests' build of them with every feature. A tar keeps the executable bits, which an artifact
      # drops. Its paths stay relative: GNU tar reads the `D:` of a Windows path as a remote host.
      - name: Pack the verifier
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          tar -cf target/verifier.tar -C target/debug "campfire-lan-check$exe" "campfire-verifier$exe"
      - name: Keep the verifier
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-${{ runner.os }}
          path: source/target/verifier.tar
          retention-days: 7
          if-no-files-found: error

  # Every platform's verifier replays every platform's session log to that server's final hash. It
  # runs the binaries its platform's check built, so it builds nothing; the checkout holds the
  # packages, at the path the check was built in.
  cross-verify:
    name: cross-verify (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verifier-${{ runner.os }}
          path: verifier
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lan-check-*
          path: ${{ runner.temp }}/runs
      - name: Verify each platform's match
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          bin=../verifier
          tar -xf "$bin/verifier.tar" -C "$bin"
          # Each artifact holds the run root of one check, with its one run's directory.
          for os in Linux Windows macOS; do
            echo "::group::the match played on $os"
            for run in "$RUNNER_TEMP/runs/lan-check-$os"/*/; do
              "$bin/campfire-lan-check$exe" verify --verifier "$bin/campfire-verifier$exe" "$run"
            done
            echo "::endgroup::"
          done
